<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Xtrhme Best 30 Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --ext: #ff0055; --adv: #ffaa00; --bas: #00ffaa; }
        body { background: #0b101a; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; }
        
        .upload-area { background: #1a2233; padding: 20px; border-bottom: 2px solid #333; margin-bottom: 20px; }
        .best-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; max-width: 1000px; margin: 0 auto; padding: 10px; background: #0b101a; }
        
        .card { background: #252d3d; border-radius: 4px; padding: 10px; text-align: left; position: relative; border-left: 4px solid #fff; transition: 0.2s; }
        .card.EXTREME { border-left-color: var(--ext); background: linear-gradient(135deg, #252d3d 0%, #4a1025 100%); }
        .card.ADVANCED { border-left-color: var(--adv); background: linear-gradient(135deg, #252d3d 0%, #4a3010 100%); }
        
        .rank { font-size: 0.7rem; color: #aaa; }
        .title { font-weight: bold; font-size: 0.8rem; margin: 3px 0; height: 2.4em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .score { font-family: monospace; color: #00d4ff; font-size: 1rem; }
        .rating { color: #fbbf24; font-weight: bold; font-size: 1.2rem; text-align: right; }
        .const-tag { font-size: 0.65rem; color: #888; }
        
        button { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background: #2563eb; }
    </style>
</head>
<body>

<div class="upload-area">
    <h1>Xtrhme Best 30</h1>
    <p>自分のスコアCSV (score.csv) を選択してください</p>
    <input type="file" id="scoreFile" accept=".csv">
    <br>
    <button id="saveBtn" style="display:none;" onclick="saveImage()">画像を保存する</button>
</div>

<div id="capture-area">
    <div id="display-area" class="best-grid">
        </div>
</div>

<script>
    let masterData = [];

    // 1. 起動時にGitHub上のマスタを読み込む
    Papa.parse("Xtrhme_music_seat.csv", {
        download: true,
        header: true,
        complete: function(results) {
            masterData = results.data;
            console.log("Master data loaded.");
        }
    });

    // 2. ユーザーがファイルを選択したら計算
    document.getElementById('scoreFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        Papa.parse(file, {
            header: true,
            complete: function(results) {
                processScores(results.data);
            }
        });
    });

    function calcRating(s, c) {
        const B2 = parseFloat(s);
        const D2 = parseFloat(c);
        if (B2 >= 104000000) return D2 + 4;
        if (B2 >= 100000000) return D2 + 2 + (B2 - 100000000) * 0.0000001;
        if (B2 >= 98000000)  return D2 + 1.8 + (B2 - 98000000) * 0.0000001;
        if (B2 >= 95000000)  return D2 + 1.5 + (B2 - 95000000) * 0.0000001;
        if (B2 >= 90000000)  return D2 + 1 + (B2 - 90000000) * 0.0000001;
        if (B2 >= 80000000)  return D2 - 1 + (B2 - 80000000) * 0.0000001;
        if (B2 >= 60000000)  return D2 - 3 + (B2 - 60000000) * 0.0000001;
        if (B2 >= 0)         return D2 * 0.00000005;
        return 0;
    }

    function processScores(userScores) {
        const finalData = userScores.map(u => {
            const info = masterData.find(m => m.Music === u.Music && m.Difficulty === u.Difficulty);
            if (!info) return null;
            const rating = calcRating(u.Score, info.Const);
            return { ...u, const: info.Const, rating: rating };
        }).filter(d => d !== null)
          .sort((a, b) => b.rating - a.rating)
          .slice(0, 30);

        render(finalData);
        document.getElementById('saveBtn').style.display = 'inline-block';
    }

    function render(data) {
        const area = document.getElementById('display-area');
        area.innerHTML = data.map((d, i) => `
            <div class="card ${d.Difficulty}">
                <div class="rank">#${i + 1} <span class="const-tag">定数:${d.const}</span></div>
                <div class="title">${d.Music}</div>
                <div class="score">${parseInt(d.score || d.Score).toLocaleString()}</div>
                <div class="rating">${d.rating.toFixed(2)}</div>
            </div>
        `).join('');
    }

    function saveImage() {
        html2canvas(document.querySelector("#capture-area")).then(canvas => {
            const link = document.createElement('a');
            link.download = 'xtrhme_best30.png';
            link.href = canvas.toDataURL();
            link.click();
        });
    }
</script>

</body>
</html>
