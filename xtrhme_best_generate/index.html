<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Xtrhme B30 Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --Master: #ff0055; --Advancer: #ffaa00; --Beginner: #00ffaa; --gold: #fbbf24; }
        body { background: #0b101a; color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        .upload-section { background: #1a2233; padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 30px; border: 1px solid #334155; }
        .b30-header { text-align: center; margin-bottom: 20px; }
        .b30-avg { font-size: 3.5rem; font-weight: bold; color: var(--gold); }
        .best-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; max-width: 1200px; margin: 0 auto; }
        .card { background: #1e293b; border-radius: 6px; padding: 12px; border-left: 5px solid #fff; }
        /* 難易度別色分け */
        .card.Master { border-left-color: var(--Master); background: linear-gradient(135deg, #1e293b 0%, #4a1025 100%); }
        .card.Advancer { border-left-color: var(--Advancer); background: linear-gradient(135deg, #1e293b 0%, #4a3010 100%); }
        .card.Beginner { border-left-color: var(--Beginner); }
        .song-name { font-weight: bold; font-size: 0.85rem; height: 2.4em; overflow: hidden; margin-bottom: 8px; }
        .score-val { color: #00d4ff; font-family: monospace; font-size: 1rem; }
        .rating-val { color: var(--gold); font-weight: bold; float: right; font-size: 1.2rem; }
        .footer { font-size: 0.7rem; color: #94a3b8; margin-top: 8px; display: flex; justify-content: space-between; }
        button { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

<div class="upload-section">
    <h1>Xtrhme Best 30</h1>
    <div class="b30-header">
        <div class="b30-label">BEST 30 AVERAGE</div>
        <div id="avg-display" class="b30-avg">0.00</div>
    </div>
    <p><code>score.csv</code> を選択してください</p>
    <input type="file" id="scoreInput" accept=".csv">
    <br><br>
    <button id="dlBtn" style="display:none;" onclick="exportImg()">画像を保存する</button>
</div>

<div id="capture-area">
    <div id="main-grid" class="best-grid"></div>
</div>

<script>
    let master = [];

    // マスタ読み込み
    Papa.parse("Xtrhme_music_seat.csv", {
        download: true, header: true, skipEmptyLines: true,
        complete: function(results) { 
            master = results.data;
            console.log("Master Loaded:", master[0]); // デバッグ用
        }
    });

    function getRating(score, constVal) {
        const s = parseFloat(score);
        const c = parseFloat(constVal);
        if (isNaN(s) || isNaN(c)) return 0;
        if (s >= 104000000) return c + 4;
        if (s >= 100000000) return c + 2 + (s - 100000000) * 0.0000001;
        if (s >= 98000000)  return c + 1.8 + (s - 98000000) * 0.0000001;
        if (s >= 95000000)  return c + 1.5 + (s - 95000000) * 0.0000001;
        if (s >= 90000000)  return c + 1 + (s - 90000000) * 0.0000001;
        if (s >= 80000000)  return c - 1 + (s - 80000000) * 0.0000001;
        if (s >= 60000000)  return c - 3 + (s - 60000000) * 0.0000001;
        if (s >= 0)         return c * 0.00000005;
        return 0;
    }

    function getRankStr(score) {
        const s = parseFloat(score);
        if (s >= 100000000) return "X";
        if (s >= 98000000)  return "S+";
        if (s >= 95000000)  return "S";
        if (s >= 90000000)  return "A";
        if (s >= 80000000)  return "B";
        if (s >= 60000000)  return "C";
        return "F";
    }

    document.getElementById('scoreInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        Papa.parse(file, {
            header: true, skipEmptyLines: true,
            complete: function(results) {
                console.log("Score CSV Parsed:", results.data[0]); // デバッグ用

                const b30 = results.data
                    .filter(row => row.score && row.score.trim() !== "")
                    .map(row => {
                        // 1. 曲名の特定 (マスタの1列目を取得)
                        const songName = row["song name"] ? row["song name"].trim() : "";
                        const diffName = row["difficulty"] ? row["difficulty"].trim() : "";
                        
                        // マスタから一致する曲を探す (キー名が空の列を考慮)
                        const info = master.find(m => {
                            const mName = (m[""] || m["song name"] || Object.values(m)[0] || "").trim();
                            return mName === songName;
                        });

                        const constant = info ? info[diffName] : null;
                        if (!constant) return null;

                        const rating = getRating(row.score, constant);
                        return { 
                            name: songName, 
                            score: row.score, 
                            diff: diffName, 
                            const: constant, 
                            rating: rating,
                            rank: getRankStr(row.score)
                        };
                    })
                    .filter(v => v !== null && v.rating > 0)
                    .sort((a, b) => b.rating - a.rating)
                    .slice(0, 30);

                const avg = b30.length ? (b30.reduce((s,v) => s + v.rating, 0) / b30.length) : 0;
                document.getElementById('avg-display').innerText = avg.toFixed(2);
                
                render(b30);
                document.getElementById('dlBtn').style.display = 'inline-block';
            }
        });
    });

    function render(data) {
        const grid = document.getElementById('main-grid');
        grid.innerHTML = data.map((d, i) => `
            <div class="card ${d.diff}">
                <div class="rank-num">#${i+1}</div>
                <div class="song-name">${d.name}</div>
                <div>
                    <span class="score-val">${parseInt(d.score).toLocaleString()}</span>
                    <span class="rating-val">${d.rating.toFixed(2)}</span>
                </div>
                <div class="footer">
                    <span>${d.diff} / 定数 ${d.const}</span>
                    <span style="font-weight:bold">${d.rank}</span>
                </div>
            </div>
        `).join('');
    }

    function exportImg() {
        html2canvas(document.querySelector("#capture-area"), {backgroundColor: "#0b101a"}).then(canvas => {
            const a = document.createElement('a');
            a.href = canvas.toDataURL();
            a.download = 'Xtrhme_B30.png';
            a.click();
        });
    }
</script>
</body>
</html>
