<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>クリエイタープロフィール</title>

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
    background: #f2f3f5;
    color: #222;
}

header {
    padding: 24px 20px;
    background: #111;
    color: white;
}

header h1 {
    margin: 0;
    font-size: 22px;
}

header p {
    margin: 6px 0 0;
    color: #aaa;
    font-size: 13px;
}

.container {
    width: min(1100px, 100%);
    margin: auto;
    padding: 20px;
}

.layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
}

.panel {
    background: white;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,.06);
}

.panel h2 {
    margin-top: 0;
    font-size: 18px;
}

.field {
    margin-bottom: 16px;
}

.field label {
    display: block;
    margin-bottom: 6px;
    font-weight: 600;
    font-size: 14px;
}

input,
textarea,
select {
    width: 100%;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 11px 12px;
    font-size: 15px;
    outline: none;
    background: white;
}

input:focus,
textarea:focus,
select:focus {
    border-color: #555;
}

textarea {
    min-height: 90px;
    resize: vertical;
}

.image-upload {
    display: flex;
    align-items: center;
    gap: 15px;
}

.avatar-preview {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: #ddd;
    object-fit: cover;
}

.links {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.link-row {
    display: grid;
    grid-template-columns: 110px 1fr auto;
    gap: 8px;
    align-items: center;
}

button {
    border: none;
    border-radius: 10px;
    padding: 11px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
}

.primary {
    width: 100%;
    background: #111;
    color: white;
    margin-top: 10px;
}

.secondary {
    background: #eee;
    color: #222;
}

.remove {
    background: #eee;
    color: #777;
    padding: 10px 12px;
}

#previewArea {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 10px;
}

.card {
    width: 100%;
    max-width: 460px;
    aspect-ratio: 1 / 1;
    border-radius: 20px;
    padding: 28px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, #ffffff, #e9e9e9);
    box-shadow: 0 15px 40px rgba(0,0,0,.15);
}

.card-content {
    height: 100%;
    display: flex;
    flex-direction: column;
}

.card-top {
    display: flex;
    align-items: center;
    gap: 18px;
}

.card-avatar {
    width: 86px;
    height: 86px;
    border-radius: 50%;
    object-fit: cover;
    background: #ccc;
}

.card-name {
    font-size: 27px;
    font-weight: 800;
    word-break: break-word;
}

.card-title {
    margin-top: 4px;
    font-size: 14px;
    opacity: .65;
}

.card-description {
    margin-top: 20px;
    font-size: 13px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
}

.card-links {
    margin-top: auto;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.card-link {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px;
    background: rgba(255,255,255,.7);
    border-radius: 10px;
    min-width: 0;
}

.card-link-name {
    font-size: 12px;
    font-weight: 700;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.card-link canvas {
    width: 42px !important;
    height: 42px !important;
    flex-shrink: 0;
}

.card-brand {
    position: absolute;
    right: 20px;
    bottom: 12px;
    font-size: 9px;
    opacity: .45;
    letter-spacing: .08em;
}

.theme-select {
    margin-bottom: 20px;
}

.theme-dark {
    background: linear-gradient(135deg, #181818, #303030);
    color: white;
}

.theme-dark .card-link {
    background: rgba(255,255,255,.1);
}

.theme-blue {
    background: linear-gradient(135deg, #dff3ff, #c8dcff);
}

.theme-purple {
    background: linear-gradient(135deg, #f0e3ff, #dfc8ff);
}

@media (max-width: 800px) {
    .layout {
        grid-template-columns: 1fr;
    }

    .panel {
        padding: 16px;
    }

    #previewArea {
        padding: 0;
    }

    .card {
        max-width: 100%;
    }
}

@media (max-width: 450px) {
    .container {
        padding: 12px;
    }

    .link-row {
        grid-template-columns: 90px 1fr auto;
    }

    .card {
        padding: 20px;
        border-radius: 15px;
    }

    .card-avatar {
        width: 68px;
        height: 68px;
    }

    .card-name {
        font-size: 22px;
    }

    .card-links {
        gap: 7px;
    }
}
</style>
</head>

<body>

<header>
    <h1>クリエイタープロフィール</h1>
    <p>あなたの活動を、1枚のプロフィールカードに。</p>
</header>

<div class="container">

<div class="layout">

<!-- 編集画面 -->
<section class="panel">

<h2>プロフィールを作成</h2>

<div class="field">
    <label>プロフィール画像</label>

    <div class="image-upload">
        <img
            id="avatarInputPreview"
            class="avatar-preview"
            alt=""
        >

        <input
            type="file"
            id="avatarInput"
            accept="image/*"
        >
    </div>
</div>

<div class="field">
    <label>クリエイター名</label>
    <input
        id="nameInput"
        type="text"
        placeholder="例：letam"
    >
</div>

<div class="field">
    <label>肩書き</label>
    <input
        id="titleInput"
        type="text"
        placeholder="例：Composer / Artist"
    >
</div>

<div class="field">
    <label>自己紹介</label>
    <textarea
        id="descriptionInput"
        placeholder="あなたの活動について紹介してください。"
    ></textarea>
</div>

<div class="field">
    <label>デザイン</label>

    <select id="themeInput">
        <option value="light">Light</option>
        <option value="dark">Dark</option>
        <option value="blue">Blue</option>
        <option value="purple">Purple</option>
    </select>
</div>

<h2>リンク</h2>

<div id="links" class="links"></div>

<button
    type="button"
    class="secondary"
    onclick="addLink()"
>
    ＋ リンクを追加
</button>

<button
    type="button"
    class="primary"
    onclick="downloadCard()"
>
    プロフィール画像を保存
</button>

</section>


<!-- プレビュー -->
<section class="panel">

<h2>プレビュー</h2>

<div id="previewArea">

<div id="card" class="card">

    <div class="card-content">

        <div class="card-top">

            <img
                id="cardAvatar"
                class="card-avatar"
                alt=""
            >

            <div>
                <div
                    id="cardName"
                    class="card-name"
                >
                    Creator Name
                </div>

                <div
                    id="cardTitle"
                    class="card-title"
                >
                    Creator
                </div>
            </div>

        </div>

        <div
            id="cardDescription"
            class="card-description"
        >
            あなたのプロフィール
        </div>

        <div
            id="cardLinks"
            class="card-links"
        ></div>

    </div>

    <div class="card-brand">
        CREATOR PROFILE
    </div>

</div>

</div>

</section>

</div>
</div>


<script>

const linksContainer = document.getElementById("links");

const defaultLinks = [
    "pixiv",
    "X",
    "YouTube",
    "SoundCloud",
    "GitHub",
    "BOOTH"
];

let avatarData = "";


/* --------------------------------
   リンク追加
-------------------------------- */

function addLink(name = "Website", url = "") {

    const row = document.createElement("div");
    row.className = "link-row";

    row.innerHTML = `
        <select class="link-name">
            <option ${name === "pixiv" ? "selected" : ""}>pixiv</option>
            <option ${name === "X" ? "selected" : ""}>X</option>
            <option ${name === "YouTube" ? "selected" : ""}>YouTube</option>
            <option ${name === "SoundCloud" ? "selected" : ""}>SoundCloud</option>
            <option ${name === "GitHub" ? "selected" : ""}>GitHub</option>
            <option ${name === "BOOTH" ? "selected" : ""}>BOOTH</option>
            <option ${name === "Instagram" ? "selected" : ""}>Instagram</option>
            <option ${name === "TikTok" ? "selected" : ""}>TikTok</option>
            <option ${name === "Website" ? "selected" : ""}>Website</option>
            <option ${name === "Other" ? "selected" : ""}>Other</option>
        </select>

        <input
            class="link-url"
            type="url"
            placeholder="https://example.com/"
            value="${escapeHtml(url)}"
        >

        <button
            type="button"
            class="remove"
        >
            ×
        </button>
    `;

    row.querySelector(".remove").onclick = () => {
        row.remove();
        updatePreview();
    };

    row.querySelector(".link-name").oninput = updatePreview;
    row.querySelector(".link-url").oninput = updatePreview;

    linksContainer.appendChild(row);

    updatePreview();
}


/* --------------------------------
   初期リンク
-------------------------------- */

defaultLinks.forEach(name => addLink(name));


/* --------------------------------
   入力イベント
-------------------------------- */

document
    .getElementById("nameInput")
    .addEventListener("input", updatePreview);

document
    .getElementById("titleInput")
    .addEventListener("input", updatePreview);

document
    .getElementById("descriptionInput")
    .addEventListener("input", updatePreview);

document
    .getElementById("themeInput")
    .addEventListener("change", updatePreview);


/* --------------------------------
   アバター
-------------------------------- */

document
    .getElementById("avatarInput")
    .addEventListener("change", function(e) {

        const file = e.target.files[0];

        if (!file) return;

        const reader = new FileReader();

        reader.onload = function(event) {

            avatarData = event.target.result;

            document
                .getElementById("avatarInputPreview")
                .src = avatarData;

            document
                .getElementById("cardAvatar")
                .src = avatarData;

        };

        reader.readAsDataURL(file);
    });


/* --------------------------------
   プレビュー更新
-------------------------------- */

function updatePreview() {

    const name =
        document.getElementById("nameInput").value
        || "Creator Name";

    const title =
        document.getElementById("titleInput").value
        || "Creator";

    const description =
        document.getElementById("descriptionInput").value
        || "あなたのプロフィール";

    document.getElementById("cardName").textContent = name;
    document.getElementById("cardTitle").textContent = title;
    document.getElementById("cardDescription").textContent = description;

    const card =
        document.getElementById("card");

    card.className = "card";

    const theme =
        document.getElementById("themeInput").value;

    if (theme === "dark") {
        card.classList.add("theme-dark");
    }

    if (theme === "blue") {
        card.classList.add("theme-blue");
    }

    if (theme === "purple") {
        card.classList.add("theme-purple");
    }

    updateLinks();
}


/* --------------------------------
   QRコード
-------------------------------- */

function updateLinks() {

    const output =
        document.getElementById("cardLinks");

    output.innerHTML = "";

    const rows =
        document.querySelectorAll(".link-row");

    rows.forEach(row => {

        const name =
            row.querySelector(".link-name").value;

        const url =
            row.querySelector(".link-url").value.trim();

        if (!url) return;

        const link =
            document.createElement("div");

        link.className = "card-link";

        const canvas =
            document.createElement("canvas");

        const label =
            document.createElement("div");

        label.className = "card-link-name";
        label.textContent = name;

        link.appendChild(canvas);
        link.appendChild(label);

        output.appendChild(link);

        QRCode.toCanvas(
            canvas,
            url,
            {
                width: 90,
                margin: 1,
                errorCorrectionLevel: "M"
            }
        );
    });
}


/* --------------------------------
   PNG保存
-------------------------------- */

async function downloadCard() {

    const card =
        document.getElementById("card");

    const canvas =
        document.createElement("canvas");

    const width = 1200;
    const height = 1200;

    canvas.width = width;
    canvas.height = height;

    const ctx =
        canvas.getContext("2d");

    const rect =
        card.getBoundingClientRect();

    const scale =
        width / rect.width;

    /*
     * html2canvasを使わず、
     * 最初は簡易的にDOM内容を描画する。
     *
     * 今後、画像出力品質を高めるために
     * html2canvas等へ変更可能。
     */

    ctx.fillStyle =
        getComputedStyle(card).backgroundColor;

    ctx.fillRect(0, 0, width, height);

    ctx.fillStyle =
        getComputedStyle(card).color;

    ctx.textAlign = "center";

    ctx.font = "bold 64px sans-serif";

    ctx.fillText(
        document.getElementById("cardName").textContent,
        width / 2,
        170
    );

    ctx.font = "32px sans-serif";

    ctx.fillText(
        document.getElementById("cardTitle").textContent,
        width / 2,
        220
    );

    ctx.font = "25px sans-serif";

    const desc =
        document
            .getElementById("cardDescription")
            .textContent;

    const lines =
        wrapText(ctx, desc, 1000);

    lines.forEach((line, i) => {

        ctx.fillText(
            line,
            width / 2,
            300 + i * 40
        );

    });


    /*
     * QRコードを画像として描画
     */

    const qrCanvases =
        document.querySelectorAll(
            "#cardLinks canvas"
        );

    const labels =
        document.querySelectorAll(
            "#cardLinks .card-link-name"
        );

    let x = 100;
    let y = 500;

    qrCanvases.forEach((qr, i) => {

        ctx.drawImage(
            qr,
            x,
            y,
            150,
            150
        );

        ctx.font =
            "bold 24px sans-serif";

        ctx.textAlign =
            "center";

        ctx.fillText(
            labels[i].textContent,
            x + 75,
            y + 185
        );

        x += 260;

        if (x > 800) {
            x = 100;
            y += 260;
        }

    });


    const link =
        document.createElement("a");

    link.download =
        "creator-profile.png";

    link.href =
        canvas.toDataURL("image/png");

    link.click();
}


/* --------------------------------
   テキスト折り返し
-------------------------------- */

function wrapText(ctx, text, maxWidth) {

    const words =
        text.split("");

    const lines = [];
    let line = "";

    for (const char of words) {

        const test =
            line + char;

        if (
            ctx.measureText(test).width
            > maxWidth
        ) {

            lines.push(line);
            line = char;

        } else {

            line = test;

        }
    }

    if (line) {
        lines.push(line);
    }

    return lines;
}


/* --------------------------------
   HTMLエスケープ
-------------------------------- */

function escapeHtml(value) {

    return value
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}

</script>

</body>
</html>
