<style>
*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    font-family:

button,

button{

.header{

.header-inner{

.logo{

.workspace{

.editor{

.field label{

}

input,

.avatar-editor{

.link-url{

.checkbox{

}

.range-row{

input[type="range"]{

.button{

</style>

<script>

/* =====================================================
   BASIC
===================================================== */

const MAX_LINKS = 12;
const STORAGE_KEY = "creator-profile-v3";

let avatarData = "";

const $ = id => document.getElementById(id);


/* =====================================================
   PLACEHOLDER
===================================================== */

function createPlaceholder(){

    const canvas = document.createElement("canvas");

    canvas.width = 300;
    canvas.height = 300;

    const ctx = canvas.getContext("2d");

    ctx.fillStyle = "#dfe2e5";
    ctx.fillRect(0,0,300,300);

    ctx.fillStyle = "#aeb3ba";

    ctx.beginPath();
    ctx.arc(150,105,55,0,Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(150,330,115,Math.PI,0);
    ctx.fill();

    return canvas.toDataURL("image/png");
}


/* =====================================================
   STATUS
===================================================== */

let statusTimer;

function showStatus(message,type="success"){

    const box = $("status");

    box.textContent = message;

    box.className =
        "status show " + type;

    clearTimeout(statusTimer);

    statusTimer = setTimeout(()=>{
        box.className = "status";
    },3000);
}


/* =====================================================
   URL VALIDATION
===================================================== */

function normalizeURL(value){

    let url = String(value || "").trim();

    if(!url){
        return "";
    }

    /*
     * スクリプト系URLは禁止
     */

    const lower = url.toLowerCase();

    if(
        lower.startsWith("javascript:") ||
        lower.startsWith("data:") ||
        lower.startsWith("file:")
    ){
        return "";
    }

    /*
     * https:// が無ければ追加
     */

    if(
        !lower.startsWith("http://") &&
        !lower.startsWith("https://")
    ){
        url = "https://" + url;
    }

    try{

        const parsed = new URL(url);

        if(
            parsed.protocol !== "http:" &&
            parsed.protocol !== "https:"
        ){
            return "";
        }

        return parsed.href;

    }catch{

        return "";
    }
}


/* =====================================================
   LINK EDITOR
===================================================== */

function addLink(service="Website",url=""){

    if(
        $("linkEditor").children.length >= MAX_LINKS
    ){
        showStatus(
            "リンクは最大12件まで追加できます。",
            "error"
        );
        return;
    }

    const item =
        document.createElement("div");

    item.className = "link-item";

    item.innerHTML = `

        <div class="link-header">

            <select class="service">

                <option>pixiv</option>
                <option>X</option>
                <option>YouTube</option>
                <option>SoundCloud</option>
                <option>GitHub</option>
                <option>BOOTH</option>
                <option>Instagram</option>
                <option>TikTok</option>
                <option>Discord</option>
                <option>Website</option>
                <option>Other</option>

            </select>

            <button
                class="remove-link"
                type="button"
            >
                ×
            </button>

        </div>

        <input
            class="link-url"
            type="text"
            inputmode="url"
            autocomplete="url"
            placeholder="https://example.com/"
        >

        <div class="link-controls">

            <button
                class="link-control up"
                type="button"
            >
                ↑ 上へ
            </button>

            <button
                class="link-control down"
                type="button"
            >
                ↓ 下へ
            </button>

        </div>

    `;

    const serviceInput =
        item.querySelector(".service");

    const urlInput =
        item.querySelector(".link-url");

    serviceInput.value = service;

    urlInput.value = url;


    serviceInput.addEventListener(
        "change",
        update
    );

    urlInput.addEventListener(
        "input",
        update
    );

    item.querySelector(".remove-link")
        .addEventListener(
            "click",
            ()=>{
                item.remove();
                update();
            }
        );


    item.querySelector(".up")
        .addEventListener(
            "click",
            ()=>{

                const previous =
                    item.previousElementSibling;

                if(previous){

                    $("linkEditor")
                        .insertBefore(
                            item,
                            previous
                        );

                    update();
                }

            }
        );


    item.querySelector(".down")
        .addEventListener(
            "click",
            ()=>{

                const next =
                    item.nextElementSibling;

                if(next){

                    $("linkEditor")
                        .insertBefore(
                            next,
                            item
                        );

                    update();
                }

            }
        );


    $("linkEditor").appendChild(item);

    update();
}


/* =====================================================
   COLLECT LINKS
===================================================== */

function collectLinks(){

    const result = [];

    $("linkEditor")
        .querySelectorAll(".link-item")
        .forEach(item=>{

            const service =
                item.querySelector(
                    ".service"
                ).value;

            const raw =
                item.querySelector(
                    ".link-url"
                ).value;

            const url =
                normalizeURL(raw);

            if(url){

                result.push({
                    service,
                    url
                });

            }

        });

    return result;
}


/* =====================================================
   PROFILE
===================================================== */

function updateProfile(){

    $("cardName").textContent =
        $("name").value.trim() ||
        "Creator Name";

    $("cardTitle").textContent =
        $("title").value.trim() ||
        "Creator";

    $("cardDescription").textContent =
        $("description").value.trim() ||
        "あなたの活動を紹介しましょう。";
}


/* =====================================================
   DESIGN
===================================================== */

function updateDesign(){

    const card = $("profileCard");

    card.className =
        "profile-card template-" +
        $("template").value;

    card.style.setProperty(
        "--accent",
        $("accentColor").value
    );

    card.style.borderRadius =
        $("radius").value + "px";

    $("radiusValue").textContent =
        $("radius").value;

    $("qrSizeValue").textContent =
        $("qrSize").value;


    const shape =
        $("avatarShape").value;

    if(shape === "circle"){

        $("cardAvatar").style.borderRadius =

        $("cardAvatar").style.borderRadius =
            "22px";

    }
    else{

        $("cardAvatar").style.borderRadius =
            "0";

    }

}


/* =====================================================
   QR CODE
===================================================== */

function generateQRCode(container,url,size){

    /*
     * 既存QRを完全に削除
     */

    container.innerHTML = "";

    if(!url){

        return false;
    }

    /*
     * QRCode.jsが読み込まれているか確認
     */

    if(
        typeof QRCode === "undefined"
    ){

        const error =
            document.createElement("div");

        error.className = "qr-error";

        error.textContent =
            "QRコードライブラリを読み込めませんでした。";

        container.appendChild(error);

        return false;
    }

    try{

        /*
         * QRCode.jsで生成
         */

        new QRCode(
            container,
            {
                text:url,

                width:size,

                height:size,

                colorDark:"#000000",

                colorLight:"#ffffff",

                correctLevel:
                    QRCode.CorrectLevel.M
            }
        );

        return true;

    }catch(error){

        console.error(
            "QR Code Error:",
            error
        );

        const errorBox =
            document.createElement("div");

        errorBox.className =
            "qr-error";

        errorBox.textContent =
            "このURLのQRコードを生成できませんでした。";

        container.appendChild(
            errorBox
        );

        return false;
    }
}


/* =====================================================
   LINK PREVIEW
===================================================== */

function updateLinks(){

    const container =
        $("cardLinks");

    container.innerHTML = "";

    const links =
        collectLinks();

    $("linkCount").textContent =
        links.length + " / " + MAX_LINKS;


    if(!links.length){

        container.innerHTML = `

            <div class="empty-links">

                リンクを追加すると<br>
                QRコードとリンクアドレスが表示されます。

            </div>

        `;

        return;
    }


    const size =
        Number($("qrSize").value);


    links.forEach(link=>{

        const box =
            document.createElement("div");

        box.className =
            "qr-item";


        const name =
            document.createElement("div");

        name.className =
            "qr-name";

        name.textContent =
            link.service;


        const qr =
            document.createElement("div");

        qr.className =
            "qr-container";


        const url =
            document.createElement("div");

        url.className =
            "qr-url";

        url.textContent =
            link.url;


        if(
            !$("showUrls").checked
        ){

            url.style.display =
                "none";

        }


        box.appendChild(name);

        box.appendChild(qr);

        box.appendChild(url);

        container.appendChild(box);


        generateQRCode(
            qr,
            link.url,
            size
        );

    });

}


/* =====================================================
   FOOTER
===================================================== */

function updateFooter(){

    $("cardFooter").style.display =
        $("showFooter").checked
            ? "flex"
            : "none";


    $("footerDate").style.display =
        $("showDate").checked
            ? "block"
            : "none";


    const date =
        new Date();


    $("footerDate").textContent =
        date.getFullYear() +
        "." +
        String(
            date.getMonth()+1
        ).padStart(2,"0") +
        "." +
        String(
            date.getDate()
        ).padStart(2,"0");
}


/* =====================================================
   AVATAR
===================================================== */

function updateAvatar(){

    const source =
        avatarData ||
        createPlaceholder();

    $("avatarPreview").src =
        source;

    $("cardAvatar").src =
        source;
}


/* =====================================================
   MASTER UPDATE
===================================================== */

function update(){

    updateProfile();

    updateDesign();

    updateAvatar();

    updateLinks();

    updateFooter();

}


/* =====================================================
   INPUT EVENTS
===================================================== */

[
    "name",
    "title",
    "description",
    "template",
    "accentColor",
    "avatarShape",
    "radius",
    "qrSize",
    "showUrls",
    "showFooter",
    "showDate"

].forEach(id=>{

    $(id).addEventListener(
        "input",
        update
    );

    $(id).addEventListener(
        "change",
        update
    );

});


/* =====================================================
   AVATAR
===================================================== */

$("avatarFile")
.addEventListener(
    "change",
    event=>{

        const file =
            event.target.files[0];

        if(!file){
            return;
        }


        if(
            file.size >
            10 * 1024 * 1024
        ){

            showStatus(
                "画像は10MB以下にしてください。",
                "error"
            );

            event.target.value = "";

            return;
        }


        const reader =
            new FileReader();


        reader.onload =
            event=>{

                avatarData =
                    event.target.result;

                update();

            };


        reader.onerror =
            ()=>{

                showStatus(
                    "画像を読み込めませんでした。",
                    "error"
                );

            };


        reader.readAsDataURL(file);

    }
);


/* =====================================================
   ADD LINK
===================================================== */

$("addLinkButton")
.addEventListener(
    "click",
    ()=>{
        addLink();
    }
);


/* =====================================================
   SAVE DATA
===================================================== */

function getData(){

    return{

        name:
            $("name").value,

        title:
            $("title").value,

        description:
            $("description").value,

        avatar:
            avatarData,

        template:
            $("template").value,

        accentColor:
            $("accentColor").value,

        avatarShape:
            $("avatarShape").value,

        radius:
            Number(
                $("radius").value
            ),

        qrSize:
            Number(
                $("qrSize").value
            ),

        showUrls:
            $("showUrls").checked,

        showFooter:
            $("showFooter").checked,

        showDate:
            $("showDate").checked,

        links:
            collectLinks()

    };

}


function applyData(data){

    if(!data){
        return;
    }


    $("name").value =
        data.name || "";

    $("title").value =
        data.title || "";

    $("description").value =
        data.description || "";


    avatarData =
        data.avatar || "";


    $("template").value =
        data.template || "sns";

    $("accentColor").value =
        data.accentColor || "#111318";

    $("avatarShape").value =
        data.avatarShape || "circle";


    $("radius").value =
        Number(data.radius) || 30;

    $("qrSize").value =
        Number(data.qrSize) || 145;


    $("showUrls").checked =
        data.showUrls !== false;

    $("showFooter").checked =
        data.showFooter !== false;

    $("showDate").checked =
        data.showDate !== false;


    $("linkEditor").innerHTML = "";


    if(
        Array.isArray(data.links)
    ){

        data.links
            .slice(0,MAX_LINKS)
            .forEach(link=>{

                addLink(
                    link.service ||
                        "Website",

                    link.url ||
                        ""
                );

            });

    }


    update();

}


/* =====================================================
   SAVE
===================================================== */

$("saveButton")
.addEventListener(
    "click",
    ()=>{

        try{

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(
                    getData()
                )
            );

            showStatus(
                "設定を保存しました。"
            );

        }catch(error){

            console.error(error);

            showStatus(
                "保存できませんでした。",
                "error"
            );

        }

    }
);


/* =====================================================
   LOAD
===================================================== */

$("loadButton")
.addEventListener(
    "click",
    ()=>{

        try{

            const raw =
                localStorage.getItem(
                    STORAGE_KEY
                );


            if(!raw){

                showStatus(
                    "保存データがありません。",
                    "error"
                );

                return;
            }


            applyData(
                JSON.parse(raw)
            );


            showStatus(
                "保存データを読み込みました。"
            );


        }catch(error){

            console.error(error);

            showStatus(
                "保存データを読み込めませんでした。",
                "error"
            );

        }

    }
);


/* =====================================================
   RESET
===================================================== */

$("resetButton")
.addEventListener(
    "click",
    ()=>{

        if(
            !confirm(
                "すべての入力内容をリセットしますか？"
            )
        ){
            return;
        }


        localStorage.removeItem(
            STORAGE_KEY
        );

        $("title").value = "";

        $("description").value = "";

        $("accentColor").value =

        $("avatarShape").value =
            "circle";

        $("radius").value = 30;

        $("qrSize").value = 145;

        $("showUrls").checked = true;

        $("showFooter").checked = true;

        $("showDate").checked = true;


        avatarData = "";


        $("linkEditor").innerHTML = "";


        addLink("pixiv","");

        addLink("X","");

        addLink("YouTube","");

        addLink("Website","");


        update();


        showStatus(
            "リセットしました。"
        );

    }
);


/* =====================================================
   PNG EXPORT
===================================================== */

$("exportButton")
.addEventListener(
    "click",
    async()=>{

        const button =
            $("exportButton");


        if(
            typeof html2canvas ===
            "undefined"
        ){

            showStatus(
                "画像出力機能を読み込めませんでした。",
                "error"
            );

            return;
        }


        button.disabled = true;

        button.textContent =
            "画像を生成しています…";


        try{

            /*
             * QRコード生成を待つ
             */

            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        500
                    )
            );


            /*
             * カードを画像化
             */

            const canvas =
                await html2canvas(
                    $("profileCard"),
                    {

                        scale:3,

                        useCORS:true,

                        allowTaint:false,

                        backgroundColor:null,

                        logging:false

                    }
                );


            const filename =
                (
                    $("name")
                        .value
                        .trim()
                        .replace(
                            /[\\/:*?"<>|]/g,
                            ""
                        )
                    ||
                    "creator-profile"
                ) +
                "-creator-profile.png";


            const link =
                document.createElement("a");


            link.download =
                filename;


            link.href =
                canvas.toDataURL(
                    "image/png"
                );


            document.body.appendChild(
                link
            );


            link.click();


            link.remove();


            showStatus(
                "PNG画像を作成しました。"
            );


        }catch(error){

            console.error(
                "Export Error:",
                error
            );


            showStatus(
                "画像の作成に失敗しました。",
                "error"
            );


        }finally{

            button.disabled = false;

            button.textContent =
                "PNG画像として保存";

        }

    }
);


/* =====================================================
   INITIALIZE
===================================================== */

function initialize(){

    /*
     * 保存データがある場合は読み込む
     */

    let loaded = false;

    try{

        const raw =
            localStorage.getItem(
                STORAGE_KEY
            );

        if(raw){

            applyData(
                JSON.parse(raw)
            );

            loaded = true;
        }

    }catch(error){

        console.error(error);

    }


    /*
     * 初回だけサンプルリンクを用意
     */

    if(!loaded){

        addLink(
            "pixiv",
            ""
        );

        addLink(
            "X",
            ""
        );

        addLink(
            "YouTube",
            ""
        );

        addLink(
            "Website",
            ""
        );

    }


    update();

}

initialize();

</script>
