<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>クリエイタープロフィール</title>

<!-- QR Code -->
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>

<!-- PNG Export -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #eef0f3;
    color: #17191d;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
}

button,
input,
textarea,
select {
    font: inherit;
}

button {
    -webkit-tap-highlight-color: transparent;
}


/* =========================================================
   HEADER
========================================================= */

.header {
    background: #111318;
    color: white;
}

.header-inner {
    max-width: 1280px;
    margin: auto;
    padding: 20px 24px;
}

.logo {
    font-size: 21px;
    font-weight: 900;
    letter-spacing: .06em;
}

.logo-sub {
    margin-top: 5px;
    font-size: 12px;
    color: #9ca0a8;
}


/* =========================================================
   APP
========================================================= */

.container {
    width: min(1280px, 100%);
    margin: auto;
    padding: 24px;
}

.workspace {
    display: grid;
    grid-template-columns: 400px minmax(0, 1fr);
    gap: 24px;
    align-items: start;
}


/* =========================================================
   EDITOR
========================================================= */

.editor {
    background: white;
    border-radius: 18px;
    padding: 22px;

    box-shadow:
        0 8px 35px rgba(0,0,0,.07);
}

.section {
    margin-bottom: 28px;
}

.section:last-child {
    margin-bottom: 0;
}

.section-title {
    margin-bottom: 14px;

    font-size: 12px;
    font-weight: 900;

    letter-spacing: .12em;

    color: #565b63;
}

.field {
    margin-bottom: 15px;
}

.field:last-child {
    margin-bottom: 0;
}

.field label {
    display: block;

    margin-bottom: 6px;

    font-size: 12px;
    font-weight: 800;
}

input,
textarea,
select {
    width: 100%;

    border: 1px solid #dfe2e6;
    border-radius: 10px;

    padding: 11px 12px;

    background: #fafbfc;
    color: #17191d;

    outline: none;

    transition:
        border-color .15s,
        background .15s;
}

input:focus,
textarea:focus,
select:focus {
    border-color: #777d86;
    background: white;
}

textarea {
    min-height: 100px;
    resize: vertical;
}


/* =========================================================
   IMAGE
========================================================= */

.avatar-editor {
    display: flex;
    align-items: center;
    gap: 14px;
}

.avatar-input {
    width: 78px;
    height: 78px;

    object-fit: cover;

    border-radius: 50%;

    background: #e3e5e8;

    flex-shrink: 0;
}

.avatar-actions {
    flex: 1;
}


/* =========================================================
   CHECKBOX
========================================================= */

.checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;

    font-size: 13px;
}

.checkbox-row input {
    width: auto;
}


/* =========================================================
   LINKS
========================================================= */

.link-editor {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.link-item {
    padding: 11px;

    border: 1px solid #dfe2e6;
    border-radius: 12px;

    background: #fafbfc;
}

.link-header {
    display: grid;

    grid-template-columns:
        minmax(95px, 1fr)
        34px;

    gap: 7px;
}

.link-url {
    margin-top: 7px;
}

.link-controls {
    display: flex;
    gap: 5px;
    margin-top: 7px;
}

.link-control {
    flex: 1;

    border: 1px solid #dfe2e6;
    background: white;

    border-radius: 8px;

    padding: 6px;

    cursor: pointer;

    font-size: 12px;
}

.link-control:disabled {
    opacity: .35;
    cursor: default;
}

.remove-link {
    border: 0;
    border-radius: 8px;

    background: #e8eaed;

    color: #555;

    cursor: pointer;
}

.remove-link:hover {
    background: #dedfe2;
}

.add-link {
    width: 100%;

    margin-top: 9px;

    padding: 11px;

    border: 1px dashed #aeb3ba;
    border-radius: 10px;

    background: white;

    cursor: pointer;

    font-weight: 800;
}

.add-link:hover {
    background: #f5f6f7;
}

.link-count {
    margin-top: 7px;

    font-size: 11px;
    color: #92969e;

    text-align: right;
}


/* =========================================================
   RANGE
========================================================= */

.range-row {
    display: grid;

    grid-template-columns: 1fr 55px;

    gap: 10px;

    align-items: center;
}

input[type="range"] {
    padding: 0;
}


/* =========================================================
   BUTTONS
========================================================= */

.button {
    width: 100%;

    border: 0;
    border-radius: 10px;

    padding: 12px;

    cursor: pointer;

    font-weight: 800;
}

.button-dark {
    background: #111318;
    color: white;
}

.button-light {
    background: #f0f1f3;
    color: #333;
}

.button-danger {
    background: #f4e9e9;
    color: #9a3030;
}

.button + .button {
    margin-top: 8px;
}

.button:active {
    transform: translateY(1px);
}


/* =========================================================
   FILE
========================================================= */

.file-input {
    font-size: 12px;
}


/* =========================================================
   PREVIEW
========================================================= */

.preview-panel {
    position: sticky;
    top: 20px;

    min-width: 0;
}

.preview-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 12px;

    font-size: 12px;
    color: #70757d;
}

.preview-toolbar strong {
    color: #292c31;
}

.preview-stage {
    width: 100%;

    display: flex;
    justify-content: center;

    padding: 10px;
}


/* =========================================================
   PROFILE CARD
========================================================= */

.profile-card {
    width: 720px;
    min-height: 900px;

    position: relative;

    overflow: hidden;

    padding: 52px;

    border-radius: 30px;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #f0f2f5
        );

    color: #17191d;

    box-shadow:
        0 28px 80px rgba(0,0,0,.18);

    transition:
        background .2s,
        color .2s,
        border-radius .2s;
}


/* Decorative elements */

.profile-decoration-one {
    position: absolute;

    width: 330px;
    height: 330px;

    border-radius: 50%;

    right: -150px;
    top: -150px;

    background: rgba(0,0,0,.045);

    pointer-events: none;
}

.profile-decoration-two {
    position: absolute;

    width: 260px;
    height: 260px;

    border-radius: 50%;

    left: -150px;
    bottom: -130px;

    background: rgba(0,0,0,.035);

    pointer-events: none;
}


/* =========================================================
   CARD HEADER
========================================================= */

.card-header {
    position: relative;
    z-index: 2;

    display: flex;
    align-items: center;

    gap: 24px;
}

.card-avatar {
    width: 120px;
    height: 120px;

    object-fit: cover;

    background: #dfe2e5;

    flex-shrink: 0;

    border-radius: 50%;
}

.card-identity {
    min-width: 0;
}

.card-name {
    font-size: 40px;

    font-weight: 900;

    line-height: 1.08;

    word-break: break-word;
}

.card-title {
    margin-top: 8px;

    font-size: 15px;

    color: #737880;

    font-weight: 700;
}


/* =========================================================
   DESCRIPTION
========================================================= */

.card-description {
    position: relative;
    z-index: 2;

    margin-top: 34px;

    font-size: 16px;

    line-height: 1.8;

    white-space: pre-wrap;

    word-break: break-word;
}


/* =========================================================
   LINKS
========================================================= */

.card-links {
    position: relative;
    z-index: 2;

    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 18px;

    margin-top: 36px;
}

.qr-item {
    min-width: 0;

    display: flex;

    flex-direction: column;

    align-items: center;

    padding: 18px;

    background:
        rgba(255,255,255,.78);

    border:
        1px solid rgba(0,0,0,.07);

    border-radius: 18px;

    backdrop-filter: blur(6px);
}

.qr-name {
    margin-bottom: 11px;

    font-size: 14px;

    font-weight: 900;
}

.qr-code {
    width: 145px;
    height: 145px;

    image-rendering: pixelated;
}

.qr-url {
    width: 100%;

    margin-top: 11px;

    font-size: 10px;

    line-height: 1.45;

    color: #656a72;

    text-align: center;

    word-break: break-all;
}

.qr-url.hidden {
    display: none;
}


/* =========================================================
   FOOTER
========================================================= */

.card-footer {
    position: absolute;

    z-index: 2;

    left: 52px;
    right: 52px;

    bottom: 30px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    border-top:
        1px solid rgba(0,0,0,.08);

    padding-top: 14px;
}

.footer-title {
    font-size: 11px;

    font-weight: 900;

    letter-spacing: .15em;

    color: #777c84;
}

.footer-date {
    font-size: 9px;

    color: #999da5;
}


/* =========================================================
   EMPTY
========================================================= */

.empty-links {
    grid-column: 1 / -1;

    padding: 50px 20px;

    text-align: center;

    color: #9b9fa6;

    font-size: 13px;
}


/* =========================================================
   STATUS
========================================================= */

.status {
    display: none;

    margin-bottom: 12px;

    padding: 10px 12px;

    border-radius: 9px;

    font-size: 12px;
}

.status.show {
    display: block;
}

.status.error {
    background: #f8eaea;
    color: #9a3030;
}

.status.success {
    background: #eaf5ec;
    color: #31723b;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width: 960px) {

    .workspace {
        grid-template-columns: 1fr;
    }

    .preview-panel {
        position: static;
        order: -1;
    }

    .profile-card {
        max-width: 720px;
    }
}


@media(max-width: 600px) {

    .container {
        padding: 12px;
    }

    .header-inner {
        padding: 17px;
    }

    .editor {
        padding: 16px;
        border-radius: 14px;
    }

    .preview-stage {
        padding: 0;
    }

    .profile-card {
        min-height: 720px;

        padding: 28px;

        border-radius: 20px;
    }

    .card-header {
        gap: 15px;
    }

    .card-avatar {
        width: 78px;
        height: 78px;
    }

    .card-name {
        font-size: 27px;
    }

    .card-title {
        font-size: 12px;
    }

    .card-description {
        margin-top: 24px;

        font-size: 13px;
    }

    .card-links {
        grid-template-columns: 1fr;

        margin-top: 25px;

        gap: 12px;
    }

    .qr-item {
        padding: 14px;
    }

    .qr-code {
        width: 120px;
        height: 120px;
    }

    .card-footer {
        left: 28px;
        right: 28px;

        bottom: 18px;
    }
}

</style>
</head>


<body>

<header class="header">

</header>


<main class="container">

<div class="workspace">


<!-- =====================================================
     EDITOR

<section class="editor">


<div

<!-- PROFILE -->

<script>

/* =========================================================
   CONSTANTS
========================================================= */

const MAX_LINKS = 12;

const STORAGE_KEY =
    "creator-profile-data-v1";


/* =========================================================
   STATE
========================================================= */

let avatarData = "";


/* =========================================================
   ELEMENTS
========================================================= */

const $ = id =>
    document.getElementById(id);

const linkEditor =
    $("linkEditor");


/* =========================================================
   DEFAULT DATA
========================================================= */

const defaultData = {

    name: "",

    title: "",

    description: "",

    avatar: "",

    theme: "white",

    layout: "grid",

    avatarShape: "circle",

    accentColor: "#111318",

    radius: 30,

    qrSize: 145,

    showUrls: true,

    showFooter: true,

    showDate: true,

    links: [

        {
            service: "pixiv",
            url: ""
        },

        {
            service: "X",
            url: ""
        },

        {
            service: "YouTube",
            url: ""
        },

        {
            service: "SoundCloud",
            url: ""
        }

    ]

};


/* =========================================================
   STATUS
========================================================= */

let statusTimer = null;

function showStatus(
    message,
    type = "success"
) {

    const status =
        $("status");

    status.textContent =
        message;

    status.className =
        "status show " + type;

    clearTimeout(statusTimer);

    statusTimer =
        setTimeout(
            () => {

                status.className =
                    "status";

            },
            3000
        );

}


/* =========================================================
   SANITIZE URL
========================================================= */

function normalizeURL(value) {

    let url =
        String(value || "")
            .trim();

    if (!url) {
        return "";
    }

    /*
     * javascript:
     * data:
     * file:
     * などを拒否
     */

    const lower =
        url.toLowerCase();

    if (
        lower.startsWith("javascript:") ||
        lower.startsWith("data:") ||
        lower.startsWith("file:")
    ) {

        return "";

    }

    /*
     * httpがなければ補完
     */

    if (
        !lower.startsWith("http://") &&
        !lower.startsWith("https://")
    ) {

        url =
            "https://" + url;

    }

    try {

        const parsed =
            new URL(url);

        if (
            parsed.protocol !== "http:" &&
            parsed.protocol !== "https:"
        ) {

            return "";

        }

        return parsed.href;

    } catch {

        return "";

    }

}


/* =========================================================
   CREATE LINK ITEM
========================================================= */

function createLinkItem(
    service = "Other",
    url = ""
) {

    if (
        linkEditor.children.length
        >= MAX_LINKS
    ) {

        showStatus(
            "リンクは最大12件まで追加できます。",
            "error"
        );

        return;

    }


    const item =
        document.createElement("div");

    item.className =
        "link-item";


    item.innerHTML = `

        <div class="link-header">

            <select class="service">

                <option value="pixiv">pixiv</option>
                <option value="X">X</option>
                <option value="YouTube">YouTube</option>
                <option value="SoundCloud">SoundCloud</option>
                <option value="GitHub">GitHub</option>
                <option value="BOOTH">BOOTH</option>
                <option value="Instagram">Instagram</option>
                <option value="TikTok">TikTok</option>
                <option value="Discord">Discord</option>
                <option value="Website">Website</option>
                <option value="Other">Other</option>

            </select>

            <button
                type="button"
                class="remove-link"
                title="削除"
            >
                ×
            </button>

        </div>

        <input
            class="link-url"
            type="text"
            inputmode="url"
            placeholder="https://example.com/"
            value=""
        >

        <div class="link-controls">

            <button
                type="button"
                class="link-control move-up"
            >
                ↑ 上へ
            </button>

            <button
                type="button"
                class="link-control move-down"
            >
                ↓ 下へ
            </button>

        </div>

    `;


    const serviceSelect =
        item.querySelector(
            ".service"
        );

    const urlInput =
        item.querySelector(
            ".link-url"
        );

    const removeButton =
        item.querySelector(
            ".remove-link"
        );

    const upButton =
        item.querySelector(
            ".move-up"
        );

    const downButton =
        item.querySelector(
            ".move-down"
        );


    serviceSelect.value =
        service;

    urlInput.value =
        url;


    /*
     * Events
     */

    serviceSelect.addEventListener(
        "change",
        update
    );

    urlInput.addEventListener(
        "input",
        update
    );


    removeButton.addEventListener(
        "click",
        () => {

            item.remove();

            update();

        }
    );


    upButton.addEventListener(
        "click",
        () => {

            const previous =
                item.previousElementSibling;

            if (!previous) {
                return;
            }

            linkEditor.insertBefore(
                item,
                previous
            );

            update();

        }
    );


    downButton.addEventListener(
        "click",
        () => {

            const next =
                item.nextElementSibling;

            if (!next) {
                return;
            }

            linkEditor.insertBefore(
                next,
                item
            );

            update();

        }
    );


    linkEditor.appendChild(item);

    update();

}


/* =========================================================
   ADD LINK
========================================================= */

$("addLinkButton")
    .addEventListener(
        "click",
        () => {

            createLinkItem(
                "Other",
                ""
            );

            const items =
                linkEditor.querySelectorAll(
                    ".link-item"
                );

            const last =

            if (last) {

                last.querySelector(
                    ".link-url"
                ).focus();

            }

        }

/* =========================================================
   COLLECT LINKS
========================================================= */

function collectLinks() {

    const result = [];

    const items =
        linkEditor.querySelectorAll(
            ".link-item"
        );


    items.forEach(
        item => {

            const service =
                item.querySelector(
                    ".service"
                ).value;

            const rawURL =
                item.querySelector(
                    ".link-url"
                ).value.trim();


            if (!rawURL) {
                return;
            }


            const url =
                normalizeURL(
                    rawURL
                );


            if (!url) {
                return;
            }


            result.push({

                service,

                url

            });

        }
    );


    return result;

}


/* =========================================================
   UPDATE PROFILE
========================================================= */

function updateProfile() {

    const name =
        $("name")
            .value
            .trim();

    const title =
        $("title")
            .value
            .trim();

    const description =
        $("description")
            .value
            .trim();


    $("cardName")
        .textContent =
        name ||
        "Creator Name";


    $("cardTitle")
        .textContent =
        title ||
        "Creator";


    $("cardDescription")
        .textContent =
        description ||
        "あなたの活動を紹介しましょう。";

}


/* =========================================================
   UPDATE THEME
========================================================= */

function updateTheme() {

    const card =
        $("profileCard");

    const theme =
        $("theme").value;

    const accent =
        $("accentColor").value;


    /*
     * Accent
     */

    $("footerTitle")
        .style.color =
        accent;


    /*
     * Theme
     */

    if (theme === "dark") {

        card.style.background =
            "linear-gradient(145deg,#121419,#292d34)";

        card.style.color =
            "#ffffff";

        $("cardTitle")
            .style.color =
            "#aeb2b9";

        $("cardDescription")
            .style.color =
            "#d0d3d8";

    }

    else if (theme === "minimal") {

        card.style.background =
            "#ffffff";

        card.style.color =
            "#17191d";

        $("cardTitle")
            .style.color =
            "#777c84";

        $("cardDescription")
            .style.color =
            "#454a51";

    }

    else {

        card.style.background =
            "linear-gradient(145deg,#ffffff,#f0f2f5)";

        card.style.color =
            "#17191d";

        $("cardTitle")
            .style.color =
            "#737880";

        $("cardDescription")
            .style.color =
            "#41454b";

    }


    /*
     * Radius
     */

    const radius =
        Number(
            $("radius").value
        );

    card.style.borderRadius =
        radius + "px";

    $("radiusValue")
        .textContent =
        radius;


    /*
     * Avatar shape
     */

    const avatar =
        $("cardAvatar");

    const shape =
        $("avatarShape").value;

    if (shape === "circle") {

        avatar.style.borderRadius =
            "50%";

    }

    else if (shape === "rounded") {

        avatar.style.borderRadius =
            "22px";

    }

    else {

        avatar.style.borderRadius =
            "0";

    }


    /*
     * QR size
     */

    $("qrSizeValue")
        .textContent =
        $("qrSize").value;


    /*
     * Layout
     */

    const layout =
        $("layout").value;

    const links =
        $("cardLinks");


    if (layout === "single") {

        links.style.gridTemplateColumns =
            "1fr";

    }

    else {

        links.style.gridTemplateColumns =
            "repeat(2,minmax(0,1fr))";

    }


    if (layout === "compact") {

        links.style.gap =
            "10px";

        links.style.marginTop =
            "25px";

    }

    else {

        links.style.gap =
            "18px";

        links.style.marginTop =
            "36px";

    }

}


/* =========================================================
   UPDATE FOOTER
========================================================= */

function updateFooter() {

    const footer =
        $("cardFooter");

    footer.style.display =
        $("showFooter").checked
            ? "flex"
            : "none";


    $("footerDate").style.display =
        $("showDate").checked
            ? "block"
            : "none";


    const now =
        new Date();

    $("footerDate")
        .textContent =
        now.getFullYear()
        + "."
        + String(
            now.getMonth() + 1
        ).padStart(2,"0")
        + "."
        + String(
            now.getDate()
        ).padStart(2,"0");

}


/* =========================================================
   UPDATE LINKS
========================================================= */

function updateLinks() {

    const output =
        $("cardLinks");

    output.innerHTML = "";


    const items =
        linkEditor.querySelectorAll(
            ".link-item"
        );


    $("linkCount")
        .textContent =
        collectLinks().length
        + " / "
        + MAX_LINKS;


    const showURLs =
        $("showUrls").checked;


    let validCount = 0;


    items.forEach(
        item => {

            const service =
                item.querySelector(
                    ".service"
                ).value;

            const rawURL =
                item.querySelector(
                    ".link-url"
                ).value.trim();


            if (!rawURL) {
                return;
            }


            const url =
                normalizeURL(
                    rawURL
                );


            if (!url) {
                return;
            }


            validCount++;


            const box =
                document.createElement(
                    "div"
                );

            box.className =
                "qr-item";


            const title =
                document.createElement(
                    "div"
                );

            title.className =
                "qr-name";

            title.textContent =
                service;


            const canvas =
                document.createElement(
                    "canvas"
                );

            canvas.className =
                "qr-code";


            const address =
                document.createElement(
                    "div"
                );

            address.className =
                "qr-url";

            address.textContent =
                url;


            if (!showURLs) {

                address.classList.add(
                    "hidden"
                );

            }


            box.appendChild(title);

            box.appendChild(canvas);

            box.appendChild(address);

            output.appendChild(box);


            /*
             * QR generation
             */

            try {

                QRCode.toCanvas(
                    canvas,
                    url,
                    {
                        width:
                            Number(
                                $("qrSize").value
                            ),

                        margin: 2,

                        errorCorrectionLevel:
                            "M"
                    }
                );

            }

            catch(error) {

                console.error(
                    "QR Error:",
                    error
                );

                const errorText =
                    document.createElement(
                        "div"
                    );

                errorText.textContent =
                    "QRコードを生成できませんでした。";

                errorText.style.fontSize =
                    "11px";

                errorText.style.color =
                    "#a33";

                box.replaceChild(
                    errorText,
                    canvas
                );

            }

        }
    );


    if (validCount === 0) {

        output.innerHTML = `

            <div class="empty-links">

                リンクを追加すると<br>
                QRコードとURLが<br>
                ここに表示されます。

            </div>

        `;

    }


    /*
     * Update move buttons
     */

    const allItems =
        Array.from(
            items
        );


    allItems.forEach(
        (item,index) => {

            const up =
                item.querySelector(
                    ".move-up"
                );

            const down =
                item.querySelector(
                    ".move-down"
                );


            up.disabled =
                index === 0;

            down.disabled =
                index ===
                allItems.length - 1;

        }
    );

}


/* =========================================================
   UPDATE AVATAR
========================================================= */

function updateAvatar() {

    const source =
        avatarData;


    if (source) {

        $("avatarPreview")
            .src =
            source;

        $("cardAvatar")
            .src =
            source;

    }

    else {

        /*
         * 空の場合は
         * シンプルなプレースホルダー
         */

        const placeholder =
            createPlaceholderAvatar();

        $("avatarPreview")
            .src =
            placeholder;

        $("cardAvatar")
            .src =
            placeholder;

    }

}


/* =========================================================
   PLACEHOLDER AVATAR
========================================================= */

function createPlaceholderAvatar() {

    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width = 300;
    canvas.height = 300;

    const ctx =
        canvas.getContext(
            "2d"
        );

    ctx.fillStyle =
        "#dfe2e5";

    ctx.fillRect(
        0,
        0,
        300,
        300
    );

    ctx.fillStyle =
        "#aeb3ba";

    ctx.beginPath();

    ctx.arc(
        150,
        110,
        55,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        150,
        300,
        105,
        Math.PI,
        0
    );

    ctx.fill();

    return canvas.toDataURL(
        "image/png"
    );

}


/* =========================================================
   UPDATE
========================================================= */

function update() {

    updateProfile();

    updateTheme();

    updateFooter();

    updateAvatar();

    updateLinks();

}


/* =========================================================
   INPUT EVENTS
========================================================= */

[
    "name",
    "title",
    "description",
    "theme",
    "layout",
    "avatarShape",
    "accentColor",
    "radius",
    "qrSize",
    "showUrls",
    "showFooter",
    "showDate"

].forEach(
    id => {

        $(id).addEventListener(
            "input",
            update
        );

        $(id).addEventListener(
            "change",
            update
        );

    }
);


/* =========================================================
   AVATAR FILE
========================================================= */

$("avatarFile")
    .addEventListener(
        "change",
        event => {

            const file =
                event.target.files[0];

            if (!file) {
                return;
            }


            /*
             * 画像サイズ制限
             */

            if (
                file.size >
                10 * 1024 * 1024
            ) {

                showStatus(
                    "画像は10MB以下にしてください。",
                    "error"
                );

                event.target.value = "";

                return;

            }


            const reader =
                new FileReader();


            reader.onload =
                event => {

                    avatarData =
                        event.target.result;

                    update();

                };


            reader.onerror =
                () => {

                    showStatus(
                        "画像を読み込めませんでした。",
                        "error"
                    );

                };


            reader.readAsDataURL(
                file
            );

        }
    );


/* =========================================================
   SAVE DATA
========================================================= */

function getData() {

    return {

        name:
            $("name").value,

        title:
            $("title").value,

        description:
            $("description").value,

        avatar:
            avatarData,

        theme:
            $("theme").value,

        layout:
            $("layout").value,

        avatarShape:
            $("avatarShape").value,

        accentColor:
            $("accentColor").value,

        radius:
            Number(
                $("radius").value
            ),

        qrSize:
            Number(
                $("qrSize").value
            ),

        showUrls:
            $("showUrls").checked,

        showFooter:
            $("showFooter").checked,

        showDate:
            $("showDate").checked,

        links:
            collectLinks()

    };

}


/* =========================================================
   APPLY DATA
========================================================= */

function applyData(data) {

    if (!data) {
        return;
    }


    $("name").value =
        data.name || "";

    $("title").value =
        data.title || "";

    $("description").value =
        data.description || "";


    avatarData =
        data.avatar || "";


    $("theme").value =
        data.theme || "white";

    $("layout").value =
        data.layout || "grid";

    $("avatarShape").value =
        data.avatarShape || "circle";

    $("accentColor").value =
        data.accentColor || "#111318";


    $("radius").value =
        Number.isFinite(
            Number(data.radius)
        )
            ? Number(data.radius)
            : 30;


    $("qrSize").value =
        Number.isFinite(
            Number(data.qrSize)
        )
            ? Number(data.qrSize)
            : 145;


    $("showUrls").checked =
        data.showUrls !== false;

    $("showFooter").checked =
        data.showFooter !== false;

    $("showDate").checked =
        data.showDate !== false;


    /*
     * Links
     */

    linkEditor.innerHTML = "";


    const links =
        Array.isArray(
            data.links
        )
            ? data.links
            : [];


    links
        .slice(0,MAX_LINKS)
        .forEach(
            link => {

                createLinkItem(
                    link.service || "Other",
                    link.url || ""
                );

            }
        );


    update();

}


/* =========================================================
   SAVE BUTTON
========================================================= */

$("saveButton")
    .addEventListener(
        "click",
        () => {

            try {

                const data =
                    getData();

                localStorage.setItem(
                    STORAGE_KEY,
                    JSON.stringify(data)
                );

                showStatus(
                    "設定を保存しました。"
                );

            }

            catch(error) {

                console.error(error);

                showStatus(
                    "設定を保存できませんでした。",
                    "error"
                );

            }

        }
    );


/* =========================================================
   LOAD BUTTON
========================================================= */

$("loadButton")
    .addEventListener(
        "click",
        () => {

            try {

                const raw =
                    localStorage.getItem(
                        STORAGE_KEY
                    );


                if (!raw) {

                    showStatus(
                        "保存されたデータがありません。",
                        "error"
                    );

                    return;

                }


                const data =
                    JSON.parse(raw);

                applyData(data);

                showStatus(
                    "保存データを読み込みました。"
                );

            }

            catch(error) {

                console.error(error);

                showStatus(
                    "保存データを読み込めませんでした。",
                    "error"
                );

            }

        }
    );


/* =========================================================
   AUTO LOAD
========================================================= */

function loadSavedDataSilently() {

    try {

        const raw =
            localStorage.getItem(
                STORAGE_KEY
            );


        if (!raw) {
            return false;
        }


        const data =
            JSON.parse(raw);

        applyData(data);

        return true;

    }

    catch(error) {

        console.warn(
            "Auto load failed:",
            error
        );

        return false;

    }

}


/* =========================================================
   RESET
========================================================= */

$("resetButton")
    .addEventListener(
        "click",
        () => {

            const confirmed =
                confirm(
                    "すべての入力内容をリセットしますか？"
                );


            if (!confirmed) {
                return;
            }


            localStorage.removeItem(
                STORAGE_KEY
            );


            linkEditor.innerHTML =
                "";

            avatarData =
                "";


            /*
             * Restore fields
             */

            $("name").value =
                "";

            $("title").value =
                "";

            $("description").value =
                "";

            $("theme").value =
                "white";

            $("layout").value =
                "grid";

            $("avatarShape").value =
                "circle";

            $("accentColor").value =
                "#111318";

            $("radius").value =
                "30";

            $("qrSize").value =
                "145";

            $("showUrls").checked =
                true;

            $("showFooter").checked =
                true;

            $("showDate").checked =
                true;


            /*
             * Default links
             */

            defaultData.links.forEach(
                link => {

                    createLinkItem(
                        link.service,
                        link.url
                    );

                }
            );


            update();


            showStatus(
                "リセットしました。"
            );

        }
    );


/* =========================================================
   EXPORT PNG
========================================================= */

$("exportButton")
    .addEventListener(
        "click",
        async () => {

            /*
             * html2canvasが存在するか確認
             */

            if (
                typeof html2canvas !==
                "function"
            ) {

                showStatus(
                    "画像出力ライブラリを読み込めませんでした。",
                    "error"
                );

                return;

            }


            const button =
                $("exportButton");


            button.disabled =
                true;

            button.textContent =
                "画像を生成しています…";


            try {

                /*
                 * QRコードの描画が
                 * 完了する時間を確保
                 */

                await new Promise(
                    resolve =>
                        setTimeout(
                            resolve,
                            250
                        )
                );


                const card =
                    $("profileCard");


                const canvas =
                    await html2canvas(
                        card,
                        {

                            /*
                             * 高解像度
                             */

                            scale: 3,

                            useCORS: true,

                            allowTaint: false,

                            backgroundColor:
                                null,

                            logging: false

                        }
                    );


                const name =
                    $("name")
                        .value
                        .trim()
                        .replace(
                            /[\\/:*?"<>|]/g,
                            ""
                        )
                        ||
                        "creator-profile";


                const link =
                    document.createElement(
                        "a"
                    );


                link.download =
                    name +
                    "-creator-profile.png";


                link.href =
                    canvas.toDataURL(
                        "image/png"
                    );


                document.body.appendChild(
                    link
                );


                link.click();


                link.remove();


                showStatus(
                    "PNG画像を作成しました。"
                );

            }

            catch(error) {

                console.error(
                    "Export error:",
                    error
                );


                showStatus(
                    "画像の作成に失敗しました。もう一度お試しください。",
                    "error"
                );

            }

            finally {

                button.disabled =
                    false;

                button.textContent =
                    "PNG画像として保存";

            }

        }
    );


/* =========================================================
   INITIALIZE
========================================================= */

function initialize() {

    /*
     * 最初にデフォルトリンクを作る
     */

    defaultData.links.forEach(
        link => {

            createLinkItem(
                link.service,
                link.url
            );

        }
    );


    /*
     * 保存データがあれば復元
     */

    loadSavedDataSilently();


    /*
     * 最終更新
     */

    update();

}


initialize();

</script>
