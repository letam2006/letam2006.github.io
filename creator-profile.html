<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Creator Profile</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
    background: #eef0f3;
    color: #17191d;
}

header {
    background: #111318;
    color: white;
    padding: 20px;
}

.header-inner {
    max-width: 1200px;
    margin: auto;
}

.logo {
    font-size: 20px;
    font-weight: 900;
    letter-spacing: .12em;
}

.subtitle {
    margin-top: 5px;
    font-size: 12px;
    color: #aeb4bd;
}

main {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

.layout {
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 20px;
}

/* =========================
   EDITOR
========================= */

.editor {
    background: white;
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,.07);
}

.section {
    padding-bottom: 20px;
    margin-bottom: 20px;
    border-bottom: 1px solid #e1e4e8;
}

.section:last-child {
    border-bottom: none;
}

.section-title {
    font-size: 11px;
    font-weight: 900;
    letter-spacing: .15em;
    color: #747b84;
    margin-bottom: 14px;
}

.field {
    margin-bottom: 14px;
}

.field:last-child {
    margin-bottom: 0;
}

label {
    display: block;
    font-size: 12px;
    font-weight: 800;
    margin-bottom: 6px;
}

input,
textarea,
select {
    width: 100%;
    border: 1px solid #d9dde2;
    background: #fafbfc;
    border-radius: 10px;
    padding: 10px 11px;
    outline: none;
    font-size: 14px;
}

input:focus,
textarea:focus,
select:focus {
    border-color: #777f89;
    background: white;
}

textarea {
    min-height: 110px;
    resize: vertical;
}

input[type="color"] {
    height: 42px;
    padding: 4px;
}

input[type="range"] {
    padding: 0;
}

.avatar-row {
    display: flex;
    gap: 12px;
    align-items: center;
}

.avatar-preview {
    width: 65px;
    height: 65px;
    object-fit: cover;
    border-radius: 50%;
    background: #e1e4e8;
    flex-shrink: 0;
}

.hint {
    color: #7c838c;
    font-size: 10px;
    line-height: 1.5;
    margin-top: 5px;
}

/* =========================
   LINKS
========================= */

.links {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.link-item {
    border: 1px solid #dfe3e7;
    background: #fafbfc;
    border-radius: 12px;
    padding: 10px;
}

.link-top {
    display: grid;
    grid-template-columns: 1fr 38px;
    gap: 7px;
}

.link-url {
    margin-top: 7px;
}

.link-buttons {
    display: flex;
    gap: 5px;
    margin-top: 7px;
}

.link-buttons button {
    flex: 1;
    border: 1px solid #d9dde2;
    background: white;
    border-radius: 7px;
    padding: 6px;
    font-size: 11px;
}

.delete-link {
    font-size: 18px !important;
    color: #777;
}

.add-link {
    width: 100%;
    margin-top: 10px;
    padding: 10px;
    border-radius: 10px;
    border: 1px dashed #aeb5bd;
    background: white;
    font-weight: 900;
}

.link-count {
    text-align: right;
    font-size: 10px;
    color: #777f89;
    margin-top: 5px;
}

/* =========================
   BUTTONS
========================= */

.buttons {
    display: grid;
    gap: 8px;
}

button {
    cursor: pointer;
}

.btn {
    border: none;
    border-radius: 10px;
    padding: 11px;
    font-weight: 900;
}

.primary {
    background: #111318;
    color: white;
}

.secondary {
    background: #eceff2;
    color: #17191d;
}

.danger {
    background: #f7e7e7;
    color: #963d3d;
}

/* =========================
   PREVIEW
========================= */

.preview-area {
    min-width: 0;
}

.preview-label {
    font-size: 11px;
    font-weight: 900;
    color: #747b84;
    margin: 0 0 8px 5px;
}

.preview-scroll {
    overflow: auto;
    padding: 15px;
    background: #dfe3e8;
    border-radius: 18px;
}

.profile {
    position: relative;
    width: 760px;
    min-height: 980px;
    margin: auto;
    padding: 58px;
    background: white;
    border-radius: 32px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.15);
}

.profile-background {
    position: absolute;
    inset: 0;
    pointer-events: none;
}

.profile-content {
    position: relative;
    z-index: 2;
}

.profile-header {
    display: flex;
    align-items: center;
    gap: 25px;
}

.profile-avatar {
    width: 125px;
    height: 125px;
    object-fit: cover;
    border-radius: 50%;
    background: #e0e3e7;
    flex-shrink: 0;
}

.profile-name {
    font-size: 43px;
    font-weight: 950;
    line-height: 1.1;
    word-break: break-word;
}

.profile-title {
    margin-top: 8px;
    font-size: 16px;
    color: #737983;
    font-weight: 750;
}

.profile-description {
    margin-top: 30px;
    font-size: 16px;
    line-height: 1.8;
    white-space: pre-wrap;
    word-break: break-word;
}

.profile-links {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    margin-top: 35px;
}

.profile-link {
    display: block;
    text-decoration: none;
    color: inherit;
    padding: 16px;
    border-radius: 15px;
    border: 1px solid rgba(0,0,0,.1);
    background: rgba(255,255,255,.82);
}

.profile-link-name {
    font-size: 14px;
    font-weight: 950;
    margin-bottom: 6px;
}

.profile-link-url {
    font-size: 10px;
    color: #707782;
    line-height: 1.45;
    overflow-wrap: anywhere;
}

.empty-links {
    grid-column: 1 / -1;
    text-align: center;
    padding: 45px 15px;
    color: #9298a1;
    border: 1px dashed #c8cdd4;
    border-radius: 15px;
    font-size: 12px;
}

.footer {
    position: absolute;
    bottom: 28px;
    left: 58px;
    right: 58px;
    border-top: 1px solid rgba(0,0,0,.1);
    padding-top: 12px;
    display: flex;
    justify-content: space-between;
    font-size: 9px;
    font-weight: 900;
    letter-spacing: .12em;
}

.footer-date {
    font-weight: 500;
    letter-spacing: 0;
    color: #888;
}

/* =========================
   THEMES
========================= */

.theme-sns .profile-background {
    background:
        radial-gradient(
            circle at 100% 0,
            var(--accent),
            transparent 35%
        );
    opacity: .15;
}

.theme-creator {
    background: #f6f6f3;
}

.theme-creator .profile-background {
    background:
        linear-gradient(
            135deg,
            transparent 0 58%,
            var(--accent) 58% 59%,
            transparent 59%
        );
    opacity: .12;
}

.theme-artist {
    background: #0d0f13;
    color: white;
}

.theme-artist .profile-background {
    background:
        radial-gradient(
            circle at 86% 12%,
            var(--accent),
            transparent 32%
        );
    opacity: .42;
}

.theme-artist .profile-title,
.theme-artist .profile-link-url {
    color: #aeb3bc;
}

.theme-artist .profile-link {
    background: rgba(255,255,255,.07);
    border-color: rgba(255,255,255,.15);
}

.theme-artist .footer {
    border-color: rgba(255,255,255,.18);
}

.theme-minimal {
    border: 1px solid #d8dce1;
    box-shadow: none;
}

.theme-minimal .profile-background {
    background:
        linear-gradient(
            90deg,
            transparent 49.8%,
            rgba(0,0,0,.035) 50%,
            transparent 50.2%
        ),
        linear-gradient(
            transparent 49.8%,
            rgba(0,0,0,.035) 50%,
            transparent 50.2%
        );
    background-size: 42px 42px;
}

.theme-neon {
    background: #080a0e;
    color: white;
}

.theme-neon .profile-background {
    background:
        radial-gradient(
            circle at 82% 8%,
            var(--accent),
            transparent 30%
        );
    opacity: .35;
}

.theme-neon .profile-title,
.theme-neon .profile-link-url {
    color: #aeb3bc;
}

.theme-neon .profile-link {
    background: rgba(0,0,0,.45);
    border-color: var(--accent);
}

.theme-neon .footer {
    border-color: rgba(255,255,255,.18);
}

.theme-elegant {
    background: #f1ece3;
}

.theme-elegant .profile-background {
    background:
        radial-gradient(
            circle at 90% 10%,
            var(--accent),
            transparent 28%
        );
    opacity: .13;
}

.theme-elegant .profile-name {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 700;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 900px) {

    .layout {
        grid-template-columns: 1fr;
    }

    .preview-area {
        order: -1;
    }

}

@media (max-width: 600px) {

    main {
        padding: 10px;
    }

    .editor {
        padding: 15px;
    }

    .profile {
        width: 680px;
        min-height: 850px;
        padding: 40px;
    }

    .profile-avatar {
        width: 95px;
        height: 95px;
    }

    .profile-name {
        font-size: 34px;
    }

    .profile-description {
        font-size: 14px;
    }

    .footer {
        left: 40px;
        right: 40px;
    }
}
</style>
</head>

<body>

    <div class="header-inner">
        <div class="logo">CREATOR PROFILE</div>
        <div class="subtitle">

<main>

<div class="layout">

<!-- =========================

========================= -->

<section class="editor">

</div>

<div class="field">

プロフィール画像

<script>

"use strict";


/* =================================
   基本設定
================================= */

const MAX_LINKS = 12;
const STORAGE_KEY = "creator-profile-data";

let avatarData = "";


/* =================================
   要素取得
================================= */

const $ = id => document.getElementById(id);


/* =================================
   仮プロフィール画像
================================= */

function createPlaceholder() {

    const canvas = document.createElement("canvas");

    canvas.width = 300;
    canvas.height = 300;

    const ctx = canvas.getContext("2d");

    ctx.fillStyle = "#dfe3e8";
    ctx.fillRect(0, 0, 300, 300);

    ctx.fillStyle = "#aeb5bf";

    ctx.beginPath();
    ctx.arc(150, 105, 55, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(150, 330, 115, Math.PI, 0);
    ctx.fill();

    return canvas.toDataURL("image/png");
}

const placeholderAvatar = createPlaceholder();


/* =================================
   URL安全処理
================================= */

function normalizeURL(value) {

    value = String(value || "").trim();

    if (!value) {
        return "";
    }

    if (
        value.toLowerCase().startsWith("javascript:") ||
        value.toLowerCase().startsWith("data:") ||
        value.toLowerCase().startsWith("vbscript:") ||
        value.toLowerCase().startsWith("file:")
    ) {
        return "";
    }

    if (!/^https?:\/\//i.test(value)) {
        value = "https://" + value;
    }

    try {

        const url = new URL(value);

        if (
            url.protocol !== "http:" &&
            url.protocol !== "https:"
        ) {
            return "";
        }

        return url.href;

    } catch {

        return "";
    }
}


/* =================================
   リンク追加
================================= */

function addLink(
    service = "",
    url = ""
) {

    if (
        $("links").children.length >= MAX_LINKS
    ) {
        return;
    }


    const item =
        document.createElement("div");

    item.className = "link-item";


    const top =
        document.createElement("div");

    top.className = "link-top";


    const serviceInput =
        document.createElement("input");

    serviceInput.type = "text";
    serviceInput.className = "link-service";
    serviceInput.maxLength = 40;
    serviceInput.placeholder = "サービス名";
    serviceInput.value = service;


    const deleteButton =
        document.createElement("button");

    deleteButton.type = "button";
    deleteButton.className = "delete-link";
    deleteButton.textContent = "×";


    const urlInput =
        document.createElement("input");

    urlInput.type = "url";
    urlInput.className = "link-url";
    urlInput.placeholder =
        "https://example.com/";
    urlInput.value = url;


    const buttons =
        document.createElement("div");

    buttons.className = "link-buttons";


    const up =
        document.createElement("button");

    up.type = "button";
    up.textContent = "↑ 上へ";


    const down =
        document.createElement("button");

    down.type = "button";
    down.textContent = "↓ 下へ";


    buttons.append(
        up,
        down
    );


    top.append(
        serviceInput,
        deleteButton
    );


    item.append(
        top,
        urlInput,
        buttons
    );


    $("links").appendChild(item);


    /* 入力 */

    serviceInput.addEventListener(
        "input",
        update
    );

    urlInput.addEventListener(
        "input",
        update
    );


    /* 削除 */

    deleteButton.addEventListener(
        "click",
        () => {

            item.remove();

            update();

        }
    );


    /* 上へ */

    up.addEventListener(
        "click",
        () => {

            const previous =
                item.previousElementSibling;

            if (previous) {

                $("links").insertBefore(
                    item,
                    previous
                );

                update();
            }

        }
    );


    /* 下へ */

    down.addEventListener(
        "click",
        () => {

            const next =
                item.nextElementSibling;

            if (next) {

                $("links").insertBefore(
                    next,
                    item
                );

                update();
            }

        }
    );


    update();
}


/* =================================
   リンク取得
================================= */

function getLinks() {

    return [
        ...$("links").querySelectorAll(
            ".link-item"
        )
    ]

    .map(item => {

        const service =
            item.querySelector(
                ".link-service"
            ).value.trim();

        const raw =
            item.querySelector(
                ".link-url"
            ).value.trim();

        const url =
            normalizeURL(raw);

        return {
            service:
                service || "Website",
            url
        };

    })

    .filter(
        link => link.url
    );
}


/* =================================
   プロフィール更新
================================= */

function updateProfile() {

    $("profileName").textContent =
        $("name").value.trim()
        || "Creator Name";


    $("profileTitle").textContent =
        $("title").value.trim()
        || "Creator";


    $("profileDescription").textContent =
        $("description").value.trim()
        ||
        "あなたの活動を紹介しましょう。";
}


/* =================================
   リンク表示
================================= */

function updateLinks() {

    const container =
        $("profileLinks");

    container.innerHTML = "";


    const links =
        getLinks();


    $("linkCount").textContent =
        links.length +
        " / " +
        MAX_LINKS;


    if (!links.length) {

        const empty =
            document.createElement("div");

        empty.className =
            "empty-links";

        empty.textContent =
            "リンクを追加すると、ここに表示されます。";

        container.appendChild(empty);

        return;
    }


    links.forEach(link => {

        const a =
            document.createElement("a");

        a.className =
            "profile-link";

        a.href =
            link.url;

        a.target =
            "_blank";

        a.rel =
            "noopener noreferrer";


        const name =
            document.createElement("div");

        name.className =
            "profile-link-name";

        name.textContent =
            link.service;


        const url =
            document.createElement("div");

        url.className =
            "profile-link-url";

        url.textContent =
            link.url;


        a.append(
            name,
            url
        );

        container.appendChild(a);

    });

}


/* =================================
   デザイン
================================= */

function updateDesign() {

    const profile =
        $("profile");


    profile.className =
        "profile theme-" +
        $("theme").value;


    profile.style.setProperty(
        "--accent",
        $("accent").value
    );


    profile.style.borderRadius =
        $("radius").value + "px";


    const shape =
        $("avatarShape").value;


    $("profileAvatar").style.borderRadius =
        shape === "circle"
            ? "50%"
            : shape === "rounded"
                ? "22px"
                : "0";
}


/* =================================
   フッター
================================= */

function updateFooter() {

    $("footer").style.display =
        $("showFooter").checked
            ? "flex"
            : "none";


    $("footerDate").style.display =
        $("showDate").checked
            ? "block"
            : "none";


    const date =
        new Date();


    $("footerDate").textContent =
        date.getFullYear() +
        "." +
        String(
            date.getMonth() + 1
        ).padStart(2, "0") +
        "." +
        String(
            date.getDate()
        ).padStart(2, "0");
}


/* =================================
   アバター
================================= */

function updateAvatar() {

    const src =
        avatarData ||
        placeholderAvatar;


    $("avatarPreview").src =
        src;

    $("profileAvatar").src =
        src;
}


/* =================================
   全体更新
================================= */

function update() {

    updateProfile();

    updateLinks();

    updateDesign();

    updateAvatar();

    updateFooter();
}


/* =================================
   画像読み込み
================================= */

$("avatar").addEventListener(
    "change",
    event => {

        const file =
            event.target.files[0];

        if (!file) {
            return;
        }


        if (
            file.size >
            10 * 1024 * 1024
        ) {

            alert(
                "画像サイズは10MB以下にしてください。"
            );

            event.target.value = "";

            return;
        }


        if (
            ![
                "image/png",
                "image/jpeg",
                "image/webp"
            ].includes(file.type)
        ) {

            alert(
                "PNG / JPG / WebPのみ使用できます。"
            );

            event.target.value = "";

            return;
        }


        const reader =
            new FileReader();


        reader.onload =
            () => {

                avatarData =
                    reader.result;

                update();
            };


        reader.readAsDataURL(file);

    }
);


/* =================================
   各入力
================================= */

[
    "name",
    "title",
    "description",
    "theme",
    "accent",
    "avatarShape",
    "radius",
    "showFooter",
    "showDate"
]
.forEach(id => {

    $(id).addEventListener(
        "input",
        update
    );

    $(id).addEventListener(
        "change",
        update
    );

});


/* =================================
   リンク追加
================================= */

$("addLink").addEventListener(
    "click",
    () => {

        if (
            $("links").children.length >=
            MAX_LINKS
        ) {

            alert(
                "リンクは最大12個まで追加できます。"
            );

            return;
        }

        addLink();

    }
);


/* =================================
   データ取得
================================= */

function getData() {

    return {

        name:
            $("name").value,

        title:
            $("title").value,

        description:
            $("description").value,

        avatar:
            avatarData,

        theme:
            $("theme").value,

        accent:
            $("accent").value,

        avatarShape:
            $("avatarShape").value,

        radius:
            $("radius").value,

        showFooter:
            $("showFooter").checked,

        showDate:
            $("showDate").checked,

        links:
            [
                ...$("links").querySelectorAll(
                    ".link-item"
                )
            ]
            .map(item => ({

                service:
                    item.querySelector(
                        ".link-service"
                    ).value,

                url:
                    item.querySelector(
                        ".link-url"
                    ).value

            }))

    };
}


/* =================================
   データ適用
================================= */

function applyData(data) {

    $("name").value =
        data.name || "";

    $("title").value =
        data.title || "";

    $("description").value =
        data.description || "";


    avatarData =
        data.avatar || "";


    $("theme").value =
        data.theme || "sns";


    $("accent").value =
        data.accent || "#111827";


    $("avatarShape").value =
        data.avatarShape ||
        "circle";


    $("radius").value =
        data.radius || 32;


    $("showFooter").checked =
        data.showFooter !== false;


    $("showDate").checked =
        data.showDate !== false;


    $("links").innerHTML = "";


    if (
        Array.isArray(data.links)
    ) {

        data.links
            .slice(0, MAX_LINKS)
            .forEach(link => {

                addLink(
                    link.service || "Website",
                    link.url || ""
                );

            });

    }


    update();
}


/* =================================
   保存
================================= */

$("save").addEventListener(
    "click",
    () => {

        try {

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(
                    getData()
                )
            );

            alert(
                "設定を保存しました。"
            );

        } catch(error) {

            console.error(error);

            alert(
                "保存できませんでした。"
            );

        }

    }
);


/* =================================
   読み込み
================================= */

$("load").addEventListener(
    "click",
    () => {

        try {

            const data =
                localStorage.getItem(
                    STORAGE_KEY
                );


            if (!data) {

                alert(
                    "保存データがありません。"
                );

                return;
            }


            applyData(
                JSON.parse(data)
            );


            alert(
                "保存データを読み込みました。"
            );

        } catch(error) {

            console.error(error);

            alert(
                "保存データの読み込みに失敗しました。"
            );

        }

    }
);


/* =================================
   リセット
================================= */

$("reset").addEventListener(
    "click",
    () => {

        if (
            !confirm(
                "入力内容をすべてリセットしますか？"
            )
        ) {
            return;
        }


        localStorage.removeItem(
            STORAGE_KEY
        );


        $("name").value = "";
        $("title").value = "";
        $("description").value = "";

        $("theme").value = "sns";
        $("accent").value = "#111827";
        $("avatarShape").value = "circle";
        $("radius").value = 32;

        $("showFooter").checked = true;
        $("showDate").checked = true;

        $("avatar").value = "";

        avatarData = "";


        $("links").innerHTML = "";


        addLink(
            "pixiv",
            ""
        );

        addLink(
            "X",
            ""
        );

        addLink(
            "YouTube",
            ""
        );

        addLink(
            "Website",
            ""
        );


        update();

    }
);


/* =================================
   PNG出力
================================= */

/*
    Canvasだけを使用してPNGを生成します。
    外部ライブラリは使用しません。
*/

async function exportPNG() {

    const button =
        $("export");

    button.disabled = true;

    button.textContent =
        "画像を生成中…";


    try {

        const canvas =
            document.createElement(
                "canvas"
            );


        const width = 1520;
        const height = 1960;


        canvas.width =
            width;

        canvas.height =
            height;


        const ctx =
            canvas.getContext(
                "2d"
            );


        const theme =
            $("theme").value;

        const accent =
            $("accent").value;


        const dark =
            theme === "artist" ||
            theme === "neon";


        const text =
            dark
                ? "#ffffff"
                : "#17191d";


        const muted =
            dark
                ? "#aeb3bc"
                : "#707782";


        /* 背景 */

        if (
            theme === "artist" ||
            theme === "neon"
        ) {

            ctx.fillStyle =
                "#0d0f13";

            ctx.fillRect(
                0,
                0,
                width,
                height
            );


            const gradient =
                ctx.createRadialGradient(
                    width * .86,
                    height * .08,
                    0,
                    width * .86,
                    height * .08,
                    width * .42
                );


            gradient.addColorStop(
                0,
                accent + "99"
            );

            gradient.addColorStop(
                1,
                "#00000000"
            );


            ctx.fillStyle =
                gradient;

            ctx.fillRect(
                0,
                0,
                width,
                height
            );

        } else {

            ctx.fillStyle =
                theme === "creator"
                    ? "#f6f6f3"
                    : theme === "elegant"
                        ? "#f1ece3"
                        : "#ffffff";


            ctx.fillRect(
                0,
                0,
                width,
                height
            );


            const gradient =
                ctx.createRadialGradient(
                    width,
                    0,
                    0,
                    width,
                    0,
                    width * .38
                );


            gradient.addColorStop(
                0,
                accent + "35"
            );

            gradient.addColorStop(
                1,
                "#ffffff00"
            );


            ctx.fillStyle =
                gradient;

            ctx.fillRect(
                0,
                0,
                width,
                height
            );

        }


        /* アバター */

        const avatar =
            new Image();


        await new Promise(
            (resolve, reject) => {

                avatar.onload =
                    resolve;

                avatar.onerror =
                    reject;

                avatar.src =
                    avatarData ||
                    placeholderAvatar;

            }
        );


        const avatarX = 116;
        const avatarY = 116;
        const avatarSize = 250;


        ctx.save();


        const shape =
            $("avatarShape").value;


        if (
            shape === "circle"
        ) {

            ctx.beginPath();

            ctx.arc(
                avatarX + avatarSize / 2,
                avatarY + avatarSize / 2,
                avatarSize / 2,
                0,
                Math.PI * 2
            );

            ctx.clip();

        } else {

            const radius =
                shape === "rounded"
                    ? 44
                    : 0;


            ctx.beginPath();

            ctx.roundRect(
                avatarX,
                avatarY,
                avatarSize,
                avatarSize,
                radius
            );

            ctx.clip();

        }


        ctx.drawImage(
            avatar,
            avatarX,
            avatarY,
            avatarSize,
            avatarSize
        );


        ctx.restore();


        /* 名前 */

        const name =
            $("name").value.trim()
            || "Creator Name";


        const title =
            $("title").value.trim()
            || "Creator";


        const description =
            $("description").value.trim()
            ||
            "あなたの活動を紹介しましょう。";


        ctx.fillStyle =
            text;


        ctx.font =
            "900 86px sans-serif";


        ctx.fillText(
            name.substring(0, 24),
            405,
            190
        );


        ctx.fillStyle =
            muted;


        ctx.font =
            "700 30px sans-serif";


        ctx.fillText(
            title.substring(0, 45),
            405,
            255
        );


        /* 説明 */

        ctx.fillStyle =
            text;


        ctx.font =
            "400 29px sans-serif";


        const descriptionLines =
            description.split("\n");


        let descriptionY =
            450;


        descriptionLines
            .slice(0, 7)
            .forEach(line => {

                ctx.fillText(
                    line.substring(0, 65),
                    116,
                    descriptionY
                );

                descriptionY += 48;

            });


        /* リンク */

        const links =
            getLinks();


        let linkY =
            Math.max(
                descriptionY + 35,
                700
            );


        const gap =
            28;


        const boxWidth =
            (width - 232 - gap) / 2;


        const boxHeight =
            155;


        links
            .slice(0, 12)
            .forEach(
                (link, index) => {

                    const column =
                        index % 2;

                    const row =
                        Math.floor(
                            index / 2
                        );


                    const x =
                        116 +
                        column *
                        (boxWidth + gap);


                    const y =
                        linkY +
                        row *
                        (boxHeight + 22);


                    ctx.fillStyle =
                        dark
                            ? "#ffffff12"
                            : "#ffffffd9";


                    ctx.strokeStyle =
                        dark
                            ? "#ffffff26"
                            : "#00000016";


                    ctx.beginPath();

                    ctx.roundRect(
                        x,
                        y,
                        boxWidth,
                        boxHeight,
                        22
                    );

                    ctx.fill();
                    ctx.stroke();


                    ctx.fillStyle =
                        text;


                    ctx.font =
                        "900 27px sans-serif";


                    ctx.fillText(
                        link.service,
                        x + 24,
                        y + 43
                    );


                    ctx.fillStyle =
                        muted;


                    ctx.font =
                        "400 18px sans-serif";


                    const url =
                        link.url;


                    const maxChars =
                        48;


                    const urlLines =
                        [];


                    for (
                        let i = 0;
                        i < url.length;
                        i += maxChars
                    ) {

                        urlLines.push(
                            url.substring(
                                i,
                                i + maxChars
                            )
                        );

                    }


                    urlLines
                        .slice(0, 4)
                        .forEach(
                            (line, i) => {

                                ctx.fillText(
                                    line,
                                    x + 24,
                                    y + 78 +
                                    i * 25
                                );

                            }
                        );

                }
            );


        /* フッター */

        if (
            $("showFooter").checked
        ) {

            const footerY =
                height - 70;


            ctx.strokeStyle =
                dark
                    ? "#ffffff2b"
                    : "#0000001a";


            ctx.beginPath();

            ctx.moveTo(
                116,
                footerY - 28
            );

            ctx.lineTo(
                width - 116,
                footerY - 28
            );

            ctx.stroke();


            ctx.fillStyle =
                text;


            ctx.font =
                "900 16px sans-serif";


            ctx.fillText(
                "CREATOR PROFILE",
                116,
                footerY
            );


            if (
                $("showDate").checked
            ) {

                const date =
                    new Date();


                const dateText =
                    date.getFullYear() +
                    "." +
                    String(
                        date.getMonth() + 1
                    ).padStart(2, "0") +
                    "." +
                    String(
                        date.getDate()
                    ).padStart(2, "0");


                ctx.fillStyle =
                    muted;


                ctx.font =
                    "500 16px sans-serif";


                ctx.textAlign =
                    "right";


                ctx.fillText(
                    dateText,
                    width - 116,
                    footerY
                );


                ctx.textAlign =
                    "left";
            }

        }


        /* ダウンロード */

        const filename =
            (
                name
                .replace(
                    /[\\/:*?"<>|]/g,
                    ""
                )
                .trim()
                ||
                "creator-profile"
            ) +
            "-creator-profile.png";


        const link =
            document.createElement("a");


        link.download =
            filename;


        link.href =
            canvas.toDataURL(
                "image/png"
            );


        document.body.appendChild(
            link
        );


        link.click();


        link.remove();


    } catch(error) {

        console.error(error);

        alert(
            "PNG画像の生成に失敗しました。"
        );

    } finally {

        button.disabled =
            false;

        button.textContent =
            "PNG画像として保存";

    }

}


/* =================================
   PNGボタン
================================= */

$("export").addEventListener(
    "click",
    exportPNG
);

            );

            );

            );

        addLink(

        );

        addLink(

            ""
        );

        addLink(
            "YouTube",
            ""
        );

        addLink(

        );

    update();

}
