<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>クリエイタープロフィール</title>

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #eef0f3;
    color: #16181c;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
}

.header {
    background: #111318;
    color: white;
    padding: 20px;
}

.header-inner {
    max-width: 1200px;
    margin: auto;
}

.logo {
    font-size: 20px;
    font-weight: 900;
}

.logo-sub {
    margin-top: 4px;
    color: #999;
    font-size: 12px;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 24px;
}

.workspace {
    display: grid;
    grid-template-columns: 390px 1fr;
    gap: 24px;
}

.editor {
    background: white;
    border-radius: 18px;
    padding: 22px;
    box-shadow: 0 8px 30px rgba(0,0,0,.06);
}

.section {
    margin-bottom: 26px;
}

.section-title {
    font-size: 13px;
    font-weight: 900;
    margin-bottom: 13px;
    letter-spacing: .08em;
}

.field {
    margin-bottom: 14px;
}

.field label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 6px;
}

input,
textarea,
select {
    width: 100%;
    border: 1px solid #dfe2e6;
    border-radius: 10px;
    padding: 11px 12px;
    font-size: 14px;
    background: #fafbfc;
    outline: none;
}

input:focus,
textarea:focus,
select:focus {
    border-color: #777;
    background: white;
}

textarea {
    min-height: 90px;
    resize: vertical;
}

.avatar-editor {
    display: flex;
    align-items: center;
    gap: 14px;
}

.avatar-input {
    width: 76px;
    height: 76px;
    border-radius: 50%;
    object-fit: cover;
    background: #ddd;
}

/* =========================
   LINK EDITOR
========================= */

.link-editor {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.link-item {
    border: 1px solid #dfe2e6;
    border-radius: 12px;
    padding: 11px;
    background: #fafbfc;
}

.link-header {
    display: grid;
    grid-template-columns: 105px 1fr 34px;
    gap: 6px;
}

.link-url {
    margin-top: 7px;
}

.remove-link {
    border: 0;
    border-radius: 8px;
    background: #e8eaed;
    color: #666;
    cursor: pointer;
    font-size: 17px;
    padding: 0;
}

.remove-link:hover {
    background: #ddd;
}

.add-link {
    width: 100%;
    margin-top: 9px;
    border: 1px dashed #aeb3ba;
    background: white;
    border-radius: 10px;
    padding: 11px;
    cursor: pointer;
    font-weight: 700;
}

.add-link:hover {
    background: #f5f6f7;
}

.export-button {
    width: 100%;
    border: 0;
    background: #111318;
    color: white;
    border-radius: 11px;
    padding: 14px;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
}

/* =========================
   PREVIEW
========================= */

.preview-panel {
    display: flex;
    justify-content: center;
}

.preview-stage {
    width: 100%;
    display: flex;
    justify-content: center;
}

.profile-card {
    width: 720px;
    min-height: 900px;

    position: relative;
    overflow: hidden;

    padding: 52px;

    border-radius: 30px;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #f1f3f5
        );

    box-shadow:
        0 25px 70px rgba(0,0,0,.16);
}

.card-header {
    display: flex;
    align-items: center;
    gap: 24px;
}

.card-avatar {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    background: #ddd;
}

.card-name {
    font-size: 40px;
    font-weight: 900;
    line-height: 1.1;
    word-break: break-word;
}

.card-title {
    margin-top: 7px;
    color: #777;
    font-size: 15px;
    font-weight: 600;
}

.card-description {
    margin-top: 34px;
    font-size: 16px;
    line-height: 1.8;
    white-space: pre-wrap;
    word-break: break-word;
}

.card-links {
    margin-top: 38px;

    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 20px;
}

.qr-item {
    display: flex;
    flex-direction: column;
    align-items: center;

    padding: 18px;

    background: rgba(255,255,255,.78);

    border: 1px solid rgba(0,0,0,.07);

    border-radius: 18px;
}

.qr-name {
    font-size: 14px;
    font-weight: 900;
    margin-bottom: 12px;
}

.qr-code {
    width: 145px;
    height: 145px;
    image-rendering: pixelated;
}

.qr-url {
    width: 100%;
    margin-top: 12px;

    font-size: 10px;
    line-height: 1.4;

    color: #666;

    text-align: center;

    word-break: break-all;
}

.card-footer {
    position: absolute;
    left: 52px;
    right: 52px;
    bottom: 30px;

    display: flex;
    justify-content: space-between;

    border-top: 1px solid rgba(0,0,0,.08);

    padding-top: 14px;
}

.footer-title {
    font-size: 11px;
    font-weight: 900;
    letter-spacing: .15em;
    color: #777;
}

.footer-date {
    font-size: 9px;
    color: #aaa;
}

.empty-links {
    grid-column: 1 / -1;
    padding: 50px;
    text-align: center;
    color: #aaa;
    font-size: 13px;
}

@media(max-width: 900px) {

    .workspace {
        grid-template-columns: 1fr;
    }

    .preview-panel {
        order: -1;
    }

    .profile-card {
        width: 100%;
    }
}

@media(max-width: 600px) {

    .container {
        padding: 12px;
    }

    .editor {
        padding: 16px;
    }

    .profile-card {
        min-height: 720px;
        padding: 28px;
        border-radius: 20px;
    }

    .card-header {
        gap: 15px;
    }

    .card-avatar {
        width: 78px;
        height: 78px;
    }

    .card-name {
        font-size: 26px;
    }

    .card-description {
        font-size: 13px;
        margin-top: 24px;
    }

    .card-links {
        grid-template-columns: 1fr;
        gap: 12px;
        margin-top: 25px;
    }

    .card-footer {
        left: 28px;
        right: 28px;
        bottom: 18px;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="header-inner">
        <div class="logo">
            CREATOR PROFILE
        </div>

        <div class="logo-sub">
            クリエイターの活動を、1枚のプロフィールカードに。
        </div>
    </div>
</header>


<main class="container">

<div class="workspace">

<!-- =========================
     EDITOR
========================= -->

<section class="editor">

    <div class="section">

        <div class="section-title">
            PROFILE
        </div>

        <div class="field">

            <label>
                プロフィール画像
            </label>

            <div class="avatar-editor">

                <img
                    id="avatarPreview"
                    class="avatar-input"
                    src=""
                    alt=""
                >

                <input
                    id="avatarFile"
                    type="file"
                    accept="image/*"
                >

            </div>

        </div>


        <div class="field">

            <label>
                クリエイター名
            </label>

            <input
                id="name"
                type="text"
                placeholder="例：letam"
            >

        </div>


        <div class="field">

            <label>
                肩書き
            </label>

            <input
                id="title"
                type="text"
                placeholder="例：Composer / Artist"
            >

        </div>


        <div class="field">

            <label>
                自己紹介
            </label>

            <textarea
                id="description"
                placeholder="あなたの活動について紹介してください。"
            ></textarea>

        </div>

    </div>


    <!-- =====================
         LINKS
    ====================== -->

    <div class="section">

        <div class="section-title">
            LINKS
        </div>

        <div
            id="linkEditor"
            class="link-editor"
        ></div>

        <button
            id="addLinkButton"
            class="add-link"
            type="button"
        >
            ＋ リンクを追加
        </button>

    </div>


    <div class="section">

        <div class="section-title">
            DESIGN
        </div>

        <div class="field">

            <label>
                テーマ
            </label>

            <select id="theme">

                <option value="white">
                    White
                </option>

                <option value="dark">
                    Dark
                </option>

                <option value="minimal">
                    Minimal
                </option>

            </select>

        </div>

    </div>


    <button
        id="exportButton"
        class="export-button"
        type="button"
    >
        PNG画像として保存
    </button>

</section>


<!-- =========================
     PREVIEW
========================= -->

<section class="preview-panel">

<div class="preview-stage">

<div
    id="profileCard"
    class="profile-card"
>

    <div class="card-header">

        <img
            id="cardAvatar"
            class="card-avatar"
            src=""
            alt=""
        >

        <div>

            <div
                id="cardName"
                class="card-name"
            >
                Creator Name
            </div>

            <div
                id="cardTitle"
                class="card-title"
            >
                Creator
            </div>

        </div>

    </div>


    <div
        id="cardDescription"
        class="card-description"
    >
        あなたの活動を紹介しましょう。
    </div>


    <div
        id="cardLinks"
        class="card-links"
    ></div>


    <div class="card-footer">

        <div class="footer-title">
            CREATOR PROFILE
        </div>

        <div
            id="footerDate"
            class="footer-date"
        ></div>

    </div>

</div>

</div>

</section>

</div>

</main>
