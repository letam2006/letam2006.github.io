<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>クリエイタープロフィール</title>

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #eef0f3;
    --panel: #ffffff;
    --text: #15171a;
    --sub: #747980;
    --line: #e2e5e9;
    --accent: #111318;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
}

/* =========================
   Header
========================= */

.header {
    background: #111318;
    color: white;
    padding: 20px 24px;
}

.header-inner {
    width: min(1200px, 100%);
    margin: auto;
}

.logo {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: .04em;
}

.logo-sub {
    font-size: 12px;
    color: #999da5;
    margin-top: 4px;
}

/* =========================
   Layout
========================= */

.container {
    width: min(1200px, 100%);
    margin: auto;
    padding: 24px;
}

.workspace {
    display: grid;
    grid-template-columns: 390px 1fr;
    gap: 24px;
}

/* =========================
   Editor
========================= */

.editor {
    background: var(--panel);
    border-radius: 18px;
    padding: 22px;
    box-shadow: 0 8px 30px rgba(0,0,0,.06);
}

.section {
    margin-bottom: 26px;
}

.section-title {
    font-size: 14px;
    font-weight: 800;
    margin-bottom: 14px;
}

.field {
    margin-bottom: 14px;
}

.field label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 6px;
}

input,
textarea,
select {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 11px 12px;
    font-size: 14px;
    background: #fafbfc;
    outline: none;
}

input:focus,
textarea:focus,
select:focus {
    border-color: #777;
    background: white;
}

textarea {
    min-height: 90px;
    resize: vertical;
}

/* =========================
   Avatar
========================= */

.avatar-editor {
    display: flex;
    align-items: center;
    gap: 14px;
}

.avatar-input {
    width: 76px;
    height: 76px;
    border-radius: 50%;
    object-fit: cover;
    background: #ddd;
}

/* =========================
   Links
========================= */

.link-editor {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.link-item {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px;
    background: #fafbfc;
}

.link-top {
    display: grid;
    grid-template-columns: 110px 1fr 32px;
    gap: 6px;
}

.link-url {
    margin-top: 7px;
}

.remove-link {
    border: none;
    border-radius: 8px;
    background: #e8eaed;
    cursor: pointer;
    font-size: 16px;
}

.add-link {
    width: 100%;
    border: 1px dashed #bbbfc5;
    background: transparent;
    color: #555;
    padding: 10px;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 8px;
}

/* =========================
   Buttons
========================= */

.export-button {
    width: 100%;
    border: none;
    background: #111318;
    color: white;
    border-radius: 11px;
    padding: 14px;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
}

.export-button:hover {
    opacity: .9;
}

/* =========================
   Preview
========================= */

.preview-panel {
    display: flex;
    justify-content: center;
    align-items: flex-start;
}

.preview-stage {
    width: 100%;
    display: flex;
    justify-content: center;
    padding: 15px;
}

/* =========================
   Profile Card
========================= */

.profile-card {
    width: 720px;
    min-height: 900px;

    background:
        linear-gradient(
            145deg,
            #ffffff 0%,
            #f4f5f7 100%
        );

    border-radius: 30px;

    padding: 52px;

    position: relative;

    box-shadow:
        0 25px 70px rgba(0,0,0,.16);

    overflow: hidden;
}

/* decorative background */

.profile-card::before {
    content: "";
    position: absolute;

    width: 330px;
    height: 330px;

    border-radius: 50%;

    background: rgba(0,0,0,.035);

    right: -120px;
    top: -120px;
}

.profile-card::after {
    content: "";
    position: absolute;

    width: 250px;
    height: 250px;

    border-radius: 50%;

    background: rgba(0,0,0,.025);

    left: -120px;
    bottom: -100px;
}

/* =========================
   Card Header
========================= */

.card-header {
    position: relative;
    z-index: 2;

    display: flex;
    align-items: center;
    gap: 24px;
}

.card-avatar {
    width: 120px;
    height: 120px;

    border-radius: 50%;

    object-fit: cover;

    background: #ddd;

    flex-shrink: 0;
}

.card-name {
    font-size: 40px;
    font-weight: 900;
    line-height: 1.1;

    word-break: break-word;
}

.card-title {
    margin-top: 7px;

    font-size: 15px;

    color: #777;

    font-weight: 600;
}

/* =========================
   Description
========================= */

.card-description {
    position: relative;
    z-index: 2;

    margin-top: 34px;

    font-size: 16px;

    line-height: 1.8;

    white-space: pre-wrap;

    word-break: break-word;

    color: #41454b;
}

/* =========================
   QR Links
========================= */

.card-links {
    position: relative;
    z-index: 2;

    margin-top: 38px;

    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 20px;
}

.qr-item {
    background: rgba(255,255,255,.75);

    border: 1px solid rgba(0,0,0,.07);

    border-radius: 18px;

    padding: 18px;

    display: flex;

    flex-direction: column;

    align-items: center;

    text-align: center;
}

.qr-name {
    font-size: 14px;

    font-weight: 800;

    margin-bottom: 12px;
}

.qr-code {
    width: 145px;
    height: 145px;

    image-rendering: pixelated;
}

.qr-url {
    width: 100%;

    margin-top: 12px;

    font-size: 10px;

    line-height: 1.4;

    color: #666;

    word-break: break-all;
}

/* =========================
   Footer
========================= */

.card-footer {
    position: absolute;

    z-index: 2;

    left: 52px;
    right: 52px;
    bottom: 30px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    border-top: 1px solid rgba(0,0,0,.08);

    padding-top: 14px;
}

.footer-title {
    font-size: 11px;

    font-weight: 900;

    letter-spacing: .15em;

    color: #777;
}

.footer-date {
    font-size: 9px;

    color: #aaa;
}

/* =========================
   Empty State
========================= */

.empty-links {
    grid-column: 1 / -1;

    text-align: center;

    padding: 50px;

    color: #aaa;

    font-size: 13px;
}

/* =========================
   Responsive
========================= */

@media(max-width: 900px) {

    .workspace {
        grid-template-columns: 1fr;
    }

    .preview-panel {
        order: -1;
    }

    .profile-card {
        width: 100%;
        max-width: 720px;
    }
}

@media(max-width: 600px) {

    .container {
        padding: 12px;
    }

    .header {
        padding: 17px;
    }

    .editor {
        padding: 16px;
    }

    .profile-card {
        padding: 28px;

        min-height: 700px;

        border-radius: 20px;
    }

    .card-header {
        gap: 15px;
    }

    .card-avatar {
        width: 78px;
        height: 78px;
    }

    .card-name {
        font-size: 26px;
    }

    .card-title {
        font-size: 12px;
    }

    .card-description {
        font-size: 13px;

        margin-top: 24px;
    }

    .card-links {
        grid-template-columns: 1fr;

        gap: 12px;

        margin-top: 25px;
    }

    .qr-item {
        padding: 13px;
    }

    .qr-code {
        width: 115px;
        height: 115px;
    }

    .card-footer {
        left: 28px;
        right: 28px;
        bottom: 18px;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="header-inner">
        <div class="logo">CREATOR PROFILE</div>
        <div class="logo-sub">
            クリエイターの活動を、1枚のプロフィールカードに。
        </div>
    </div>
</header>


<main class="container">

<div class="workspace">

<!-- =====================
     EDITOR
===================== -->

<section class="editor">

    <div class="section">

        <div class="section-title">
            PROFILE
        </div>

        <div class="field">

            <label>プロフィール画像</label>

            <div class="avatar-editor">

                <img
                    id="avatarPreview"
                    class="avatar-input"
                    alt=""
                >

                <input
                    id="avatarFile"
                    type="file"
                    accept="image/*"
                >

            </div>

        </div>


        <div class="field">

            <label>クリエイター名</label>

            <input
                id="name"
                type="text"
                placeholder="例：letam"
            >

        </div>


        <div class="field">

            <label>肩書き</label>

            <input
                id="title"
                type="text"
                placeholder="例：Composer / Artist"
            >

        </div>


        <div class="field">

            <label>自己紹介</label>

            <textarea
                id="description"
                placeholder="あなたの活動について紹介してください。"
            ></textarea>

        </div>

    </div>


    <div class="section">

        <div class="section-title">
            LINKS
        </div>

        <div
            id="linkEditor"
            class="link-editor"
        ></div>

        <button
            class="add-link"
            onclick="addLink()"
        >
            ＋ リンクを追加
        </button>

    </div>


    <div class="section">

        <div class="section-title">
            DESIGN
        </div>

        <div class="field">

            <label>テーマ</label>

            <select id="theme">

                <option value="white">
                    White
                </option>

                <option value="dark">
                    Dark
                </option>

                <option value="minimal">
                    Minimal
                </option>

            </select>

        </div>

    </div>


    <button
        class="export-button"
        onclick="exportPNG()"
    >
        PNG画像として保存
    </button>

</section>


<!-- =====================
     PREVIEW
===================== -->

<section class="preview-panel">

    <div class="preview-stage">

        <div
            id="profileCard"
            class="profile-card"
        >

            <div class="card-header">

                <img
                    id="cardAvatar"
                    class="card-avatar"
                    alt=""
                >

                <div>

                    <div
                        id="cardName"
                        class="card-name"
                    >
                        Creator Name
                    </div>

                    <div
                        id="cardTitle"
                        class="card-title"
                    >
                        Creator
                    </div>

                </div>

            </div>


            <div
                id="cardDescription"
                class="card-description"
            >
                あなたの活動を紹介しましょう。
            </div>


            <div
                id="cardLinks"
                class="card-links"
            ></div>


            <div class="card-footer">

                <div class="footer-title">
                    CREATOR PROFILE
                </div>

                <div
                    id="footerDate"
                    class="footer-date"
                ></div>

            </div>

        </div>

    </div>

</section>

</div>

</main>


<script>

/* =========================
   State
========================= */

let avatarData = "";


/* =========================
   Initial Links
========================= */

const initialLinks = [
    {
        name: "pixiv",
        url: ""
    },
    {
        name: "X",
        url: ""
    },
    {
        name: "YouTube",
        url: ""
    },
    {
        name: "SoundCloud",
        url: ""
    }
];


/* =========================
   Add Link
========================= */

function addLink(
    name = "Website",
    url = ""
) {

    const item =
        document.createElement("div");

    item.className = "link-item";

    item.innerHTML = `

        <div class="link-top">

            <select class="link-name">

                <option>pixiv</option>
                <option>X</option>
                <option>YouTube</option>
                <option>SoundCloud</option>
                <option>GitHub</option>
                <option>BOOTH</option>
                <option>Instagram</option>
                <option>TikTok</option>
                <option>Website</option>
                <option>Other</option>

            </select>

            <input
                class="link-url"
                type="url"
                placeholder="https://example.com/"
                value=""
            >

            <button
                class="remove-link"
                type="button"
            >
                ×
            </button>

        </div>

    `;

    const select =
        item.querySelector(".link-name");

    const input =
        item.querySelector(".link-url");

    select.value = name;

    input.value = url;

    select.addEventListener(
        "input",
        update
    );

    input.addEventListener(
        "input",
        update
    );

    item
        .querySelector(".remove-link")
        .addEventListener(
            "click",
            () => {

                item.remove();

                update();

            }
        );

    document
        .getElementById("linkEditor")
        .appendChild(item);

    update();
}


/* =========================
   Initial Setup
========================= */

initialLinks.forEach(
    link =>
        addLink(
            link.name,
            link.url
        )
);


/* =========================
   Avatar
========================= */

document
    .getElementById("avatarFile")
    .addEventListener(
        "change",
        function(event) {

            const file =
                event.target.files[0];

            if (!file) return;

            const reader =
                new FileReader();

            reader.onload =
                function(e) {

                    avatarData =
                        e.target.result;

                    document
                        .getElementById(
                            "avatarPreview"
                        )
                        .src =
                        avatarData;

                    document
                        .getElementById(
                            "cardAvatar"
                        )
                        .src =
                        avatarData;

                };

            reader.readAsDataURL(file);

        }
    );


/* =========================
   Input Events
========================= */

[
    "name",
    "title",
    "description",
    "theme"
].forEach(id => {

    document
        .getElementById(id)
        .addEventListener(
            "input",
            update
        );

});


/* =========================
   Update
========================= */

function update() {

    const name =
        document
            .getElementById("name")
            .value
            .trim();

    const title =
        document
            .getElementById("title")
            .value
            .trim();

    const description =
        document
            .getElementById("description")
            .value
            .trim();

    document
        .getElementById("cardName")
        .textContent =
        name || "Creator Name";

    document
        .getElementById("cardTitle")
        .textContent =
        title || "Creator";

    document
        .getElementById("cardDescription")
        .textContent =
        description ||
        "あなたの活動を紹介しましょう。";

    updateTheme();

    updateLinks();

    updateDate();
}


/* =========================
   Theme
========================= */

function updateTheme() {

    const card =
        document.getElementById(
            "profileCard"
        );

    const theme =
        document.getElementById(
            "theme"
        ).value;

    card.style.background = "";

    card.style.color = "";

    if (theme === "dark") {

        card.style.background =
            "linear-gradient(145deg,#15171b,#282c33)";

        card.style.color =
            "#ffffff";

    }

    if (theme === "minimal") {

        card.style.background =
            "#ffffff";

        card.style.color =
            "#111318";

    }
}


/* =========================
   QR Links
========================= */

function updateLinks() {

    const output =
        document.getElementById(
            "cardLinks"
        );

    output.innerHTML = "";

    const items =
        document.querySelectorAll(
            ".link-item"
        );

    let count = 0;

    items.forEach(item => {

        const name =
            item.querySelector(
                ".link-name"
            ).value;

        const url =
            item.querySelector(
                ".link-url"
            ).value.trim();

        if (!url) return;

        count++;

        const box =
            document.createElement(
                "div"
            );

        box.className =
            "qr-item";

        const title =
            document.createElement(
                "div"
            );

        title.className =
            "qr-name";

        title.textContent =
            name;

        const canvas =
            document.createElement(
                "canvas"
            );

        canvas.className =
            "qr-code";

        const address =
            document.createElement(
                "div"
